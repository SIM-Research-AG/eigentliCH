  $("aState").onchange = () => draw().catch(e => problem(e));
  await draw();
});

// ---- Questionnaires and content ---------------------------------------------------------
page("curator/questionnaires", "curator", "Questionnaires", async () => {
  head("Questionnaires and content", "Versioned content: every save is a new version recording who and when (save_content). Clients and curators both edit it directly; nothing is overwritten.");
  if (storeProblem()) return;
  const [keys, binds] = await Promise.all([api("/curator/content"), api("/curator/binds")]);
  const kinds = [...new Set(keys.map(k => k.kind))];
  const f = document.createElement("div"); f.className = "filters"; $("main").append(f);
  const key = S.params.get("key") || store.get("curator:content") || ((keys.find(k => k.kind === "questionnaire") || keys[0]) || {}).key;
  if (!key) { card("No content", "The store holds no content yet (python -m eigentlich seed)."); return; }
  store.set("curator:content", key);
  const cur = keys.find(k => k.key === key) || {};
  f.innerHTML = `<label>Kind <select id="qKind"><option value="">all</option>${kinds.map(k => `<option>${esc(k)}</option>`).join("")}</select></label>
    <label>Content <select id="qKey"></select></label><span class="spacer"></span><span class="ink2">${binds.length} scoring binds do not match the current questionnaires</span>`;
  $("qKind").value = store.get("curator:kind") ?? "questionnaire";
  const fillKeys = () => { const k = $("qKind").value; $("qKey").innerHTML = keys.filter(x => !k || x.kind === k || x.key === key).map(x => `<option value="${esc(x.key)}">${esc(x.key)} (v${x.version})</option>`).join(""); $("qKey").value = key; };
  fillKeys();
  $("qKind").onchange = () => { store.set("curator:kind", $("qKind").value); fillKeys(); };
  $("qKey").onchange = () => { location.hash = `#/curator/questionnaires?key=${encodeURIComponent($("qKey").value)}`; };

  const mine = binds.filter(b => b.questionnaire_key === key || b.scoring_key === key);
  const bc = card(`Scoring binds against ${esc(key)}`, "Each bind ties a literal string of a scoring map to a question and the option value it stands for (view scoring_bind_check, live: an edit shows its effect at once). Mismatches are reported, never fixed silently.");
  bc.innerHTML = table(mine, [["Scoring map", b => `${esc(b.scoring_key)} <span class="muted">v${b.scoring_version}</span>`], ["Path", b => `<code>${esc(JSON.stringify(b.path))}</code>`],
    ["String", b => esc(b.string)], ["Question", b => `${esc(b.questionnaire_key)} · <code>${esc(b.question_key)}</code>`], ["Option value", b => esc(b.option_value)],
    ["Status", b => `<span class="warn">${esc(label(b.status))}</span>`]], `No mismatch touches ${esc(key)}.`);

  const versions = await api(`/curator/content/versions?key=${encodeURIComponent(key)}`);
  const vsel = Number(S.params.get("v")) || versions[0].version;
  const vc = card("Versions", `${esc(key)} (${esc(cur.kind || versions[0].kind)}): ${versions.length} versions, the latest is v${versions[0].version}.`);
  vc.innerHTML = table(versions, [["Version", v => v.version === vsel ? `<b>v${v.version}</b>` : `<a href="#/curator/questionnaires?key=${encodeURIComponent(key)}&v=${v.version}">v${v.version}</a>`],
    ["Saved", v => when(v.saved_at)], ["By", v => `${esc(v.saved_by_kind)} ${esc(v.saved_by_name || (v.saved_by_kind === "seed" ? v.saved_by_ref : String(v.saved_by_ref).slice(0, 12)))}`],
    ["Note", v => `<span class="ink2">${esc((v.note || "").slice(0, 200))}</span>`]]);

  const rec = await api(`/curator/content/version?${new URLSearchParams({ key, version: vsel })}`);
  const E = { body: JSON.parse(JSON.stringify(rec.body)), open: new Set(), mode: rec.kind === "questionnaire" ? "form" : "json" };
  const ed = card(`Edit ${esc(key)}`, `${vsel !== versions[0].version ? `<span class="warn">You are editing v${vsel}, not the latest (v${versions[0].version}); saving makes v${versions[0].version + 1} from it.</span> ` : ""}Saving writes version v${versions[0].version + 1} as the acting curator.${rec.kind === "questionnaire" ? " Questions, why-texts and options (German) in the form; anything else in JSON." : ""}`);
  const sections = Object.fromEntries((E.body.sections || []).map(s => [s.key, s]));
  const qHtml = (q, i) => {
    const opts = Array.isArray(q.options) ? q.options : null;
    return `<details class="qn" data-i="${i}"${E.open.has(i) ? " open" : ""}><summary><span class="muted">${esc(q.order ?? "")}</span> <code>${esc(q.key)}</code> · ${esc(q.type)}${q.required ? " · required" : ""} · ${esc(String(tx(q.question)).slice(0, 90))}</summary>
      <div class="grid2"><label>Question (de) <input class="full" data-f="question" value="${esc(tx(q.question))}"></label>
        <label>Why (de) <textarea rows="2" data-f="why">${esc(tx(q.why))}</textarea></label></div>
      ${opts ? `<table style="margin-top:6px"><thead><tr><th class="l">Option value (what answers and scoring binds store)</th><th class="l">Label (de)</th><th></th></tr></thead><tbody>${opts.map((o, j) => typeof o === "string"
          ? `<tr><td class="l"><input class="wide" data-f="opt-value" data-o="${j}" value="${esc(o)}"></td><td class="l muted">(plain string option)</td><td><button type="button" data-rm="${j}">Remove</button></td></tr>`
          : `<tr><td class="l"><input class="wide" data-f="opt-value" data-o="${j}" value="${esc(o.value)}"></td><td class="l"><input class="wide" data-f="opt-label" data-o="${j}" value="${esc(tx(o.label))}"></td><td><button type="button" data-rm="${j}">Remove</button></td></tr>`).join("")}</tbody></table>
        <button type="button" data-add style="margin-top:4px">Add option</button>` : ""}
      ${q.type === "repeat" ? `<p class="note">A repeat question: its fields are edited in JSON.</p>` : ""}</details>`;
  };
  const drawEditor = () => {
    const qs = E.body.questions || [];
    let form = "";
    if (E.mode === "form") {
      const groups = []; qs.forEach((q, i) => { const s = q.section ?? ""; let g = groups.find(x => x.s === s); if (!g) groups.push(g = { s, items: [] }); g.items.push([q, i]); });
      form = groups.map(g => `${g.s !== "" ? `<h3 class="chart-t">${esc(g.s)} ${esc(tx((sections[g.s] || {}).title) || "")}</h3>` : ""}${g.items.map(([q, i]) => qHtml(q, i)).join("")}`).join("");
    }
    ed.innerHTML = `<div class="row" style="margin-bottom:8px">${rec.kind === "questionnaire" ? `<label class="inline"><input type="radio" name="qMode" value="form"${E.mode === "form" ? " checked" : ""}> form</label><label class="inline"><input type="radio" name="qMode" value="json"${E.mode === "json" ? " checked" : ""}> JSON</label>` : ""}
        <span class="spacer"></span><input id="qNote" placeholder="Note (e.g. Option ergänzt)" style="min-width:260px"><button type="button" class="primary" id="qSave">Save as v${versions[0].version + 1}</button></div>
      ${E.mode === "form" ? `<div id="qForm">${form}</div>` : `<textarea id="qJson" rows="28">${esc(JSON.stringify(E.body, null, 1))}</textarea>`}<div id="qOut"></div>`;
    ed.querySelectorAll('input[name="qMode"]').forEach(r => r.onchange = () => {
      if (E.mode === "json") { try { E.body = JSON.parse($("qJson").value); } catch { toast(`<span class="bad">The JSON does not parse; fix it before switching.</span>`); r.checked = false; return; } }
      E.mode = r.value; drawEditor();
    });
    const qf = $("qForm");
    if (qf) {
      qf.addEventListener("toggle", e => { const i = Number(e.target.dataset.i); if (e.target.open) E.open.add(i); else E.open.delete(i); }, true);
      qf.oninput = e => {
        const el = e.target, det = el.closest("details"); if (!det || !el.dataset.f) return;
        const q = E.body.questions[Number(det.dataset.i)], j = Number(el.dataset.o);
        const setDe = (obj, v) => ({ ...(obj && typeof obj === "object" ? obj : {}), de: v });
        if (el.dataset.f === "question") q.question = setDe(q.question, el.value);
        else if (el.dataset.f === "why") q.why = setDe(q.why, el.value);
        else if (el.dataset.f === "opt-value") { if (typeof q.options[j] === "string") q.options[j] = el.value; else q.options[j].value = el.value; }
        else if (el.dataset.f === "opt-label") q.options[j].label = setDe(q.options[j].label, el.value);
      };
      qf.onclick = e => {
        const det = e.target.closest("details"); if (!det) return;
        const q = E.body.questions[Number(det.dataset.i)];
        if (e.target.dataset.add !== undefined) { q.options.push({ value: "", label: { de: "" } }); E.open.add(Number(det.dataset.i)); drawEditor(); }
        else if (e.target.dataset.rm !== undefined) { q.options.splice(Number(e.target.dataset.rm), 1); E.open.add(Number(det.dataset.i)); drawEditor(); }
      };
    }
    $("qSave").onclick = () => act($("qSave"), async () => {
      let body = E.body;
      if (E.mode === "json") { try { body = JSON.parse($("qJson").value); } catch { throw new Error("The JSON does not parse."); } }
      const r = await cpost("/content", { key, kind: rec.kind, body, note: $("qNote").value.trim() || null });
      toast(`Saved ${esc(key)} as v${r.version}. ${r.bind_check.length} scoring binds now mismatch against it.`, 7000);
      location.hash = `#/curator/questionnaires?key=${encodeURIComponent(key)}`; route();
    });
  };
  drawEditor();
});

function drawFlow(host, g) {
  // Layout only: an engine's column is one more than its deepest upstream engine.
  const byKey = Object.fromEntries(g.nodes.map(n => [n.key, n])), depth = {};
  const d = k => depth[k] ?? (depth[k] = (byKey[k].consumes.filter(u => byKey[u]).map(d).reduce((a, b) => Math.max(a, b + 1), 0)));
  g.nodes.forEach(n => d(n.key));
  const cols = {}; g.nodes.forEach(n => (cols[depth[n.key]] ||= []).push(n));
  const W = 172, H = 44, GX = 58, GY = 14, pos = {};
  Object.entries(cols).forEach(([c, ns]) => ns.forEach((n, r) => pos[n.key] = { x: 12 + c * (W + GX), y: 12 + r * (H + GY) }));
  const width = 24 + (Object.keys(cols).length) * (W + GX) - GX, height = 24 + Math.max(...Object.values(cols).map(ns => ns.length)) * (H + GY) - GY;
  const edges = g.edges.filter(([a, b]) => pos[a] && pos[b]).map(([a, b]) => { const p = pos[a], q = pos[b], x1 = p.x + W, y1 = p.y + H / 2, x2 = q.x, y2 = q.y + H / 2, mx = (x1 + x2) / 2;
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 6},${y2}" fill="none" stroke="${css("--axis")}" stroke-width="1.5" marker-end="url(#arr)"/>`; }).join("");
  const nodes = g.nodes.map(n => { const p = pos[n.key], solid = ["built", "parked"].includes(n.status);
    return `<a href="#/${S.config.mode === "development" ? "bench/" + n.key : "system/engines"}"><g><title>${esc(n.name)}: ${n.status}${n.up ? ", running" : ""}</title>
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8" fill="${css("--raised")}" stroke="${n.up ? css("--good") : css("--axis")}" stroke-width="${n.up ? 2 : 1}" ${solid ? "" : 'stroke-dasharray="4 3"'}/>
      <text x="${p.x + 10}" y="${p.y + 18}" fill="${css("--ink")}" font-weight="600">${esc(n.key)}</text>
      <text x="${p.x + 10}" y="${p.y + 34}" fill="${css("--muted")}">${esc(n.produces.length > 24 ? n.produces.slice(0, 23) + "…" : n.produces)}</text></g></a>`; }).join("");
  host.innerHTML = `<div class="scroll flow"><svg width="${width}" height="${height}" role="img" aria-label="Engine flow"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--axis")}"/></marker></defs>${edges}${nodes}</svg></div>`;
}

// ---------------------------------------------------------------------------------------
// Models: every engine explained on its own data (GET /model, model-card@1.0.0)
// ---------------------------------------------------------------------------------------
// The engine computes every number on these pages, the intermediate steps included; the page
// only draws them. Formulas are LaTeX from the engine, typeset with KaTeX (same CDN as Plotly,
// loaded on the first model page only; without it the formula is shown as source).
const MODELS = [["cycle", "Cycle Model"], ["honi", "Health of Nations"], ["macrofield", "Macro Field"], ["mrs", "Market Risk Signal"], ["aggregation", "Aggregation (Regime)"]];
const SLOTS = ["--s1", "--s2", "--s3", "--s4", "--s5"];
let katexP = null;
function loadKatex() {
  if (window.katex && window.katex.renderToString) return Promise.resolve(window.katex);
  if (!katexP) katexP = new Promise((ok, no) => {
    const l = document.createElement("link"); l.rel = "stylesheet";
    l.href = "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"; document.head.append(l);
    const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js";
    s.onload = () => ok(window.katex); s.onerror = () => { katexP = null; no(new Error("KaTeX not reachable")); };
    document.head.append(s);
  });
  return katexP;
}
function tex(k, src, display = true) {
  if (!src) return "";
  if (!k) return `<code>${esc(src)}</code>`;
  try { return k.renderToString(src, { displayMode: display, throwOnError: false, output: "html" }); }
  catch { return `<code>${esc(src)}</code>`; }
}
function modelChart(host, ch) {
  const heat = ch.kind === "heatmap";
  const el = chartIn(host, heat ? (ch.rows.length === 1 ? 160 : Math.max(220, 70 + (ch.rows.length > 12 ? 12 : 24) * ch.rows.length)) : 320);
  const shapes = [], annotations = [];
  if (ch.projected_from !== null && ch.projected_from !== undefined && ch.x.length) {
    const num = typeof ch.projected_from === "number";
    const x0 = num ? ch.projected_from - 0.5 : ch.projected_from, x1 = num ? ch.x[ch.x.length - 1] + 0.5 : ch.x[ch.x.length - 1];
    shapes.push({ type: "rect", xref: "x", yref: "paper", x0, x1, y0: 0, y1: 1, fillcolor: css("--band"), line: { width: 0 }, layer: heat ? "above" : "below" });
    annotations.push({ x: x0, y: 1, xref: "x", yref: "paper", xanchor: "left", yanchor: "bottom", text: " projected", showarrow: false, font: { color: css("--muted"), size: 11 } });
  }
  if (heat) {
    const cat = ch.categories.length > 0, n = ch.categories.length;
    const scale = cat ? ch.categories.flatMap((_, i) => [[i / n, css(SLOTS[i % 5])], [(i + 1) / n, css(SLOTS[i % 5])]]) : seqScale();
    plot(el, [{
      type: "heatmap", x: ch.x, y: ch.rows, z: ch.z, colorscale: scale, xgap: 1, ygap: 1,
      zmin: cat ? -0.5 : undefined, zmax: cat ? n - 0.5 : undefined,
      customdata: cat ? ch.z.map(r => r.map(v => v === null ? "no position" : ch.categories[v])) : undefined,
      hovertemplate: cat ? "%{y} · %{x}: %{customdata}<extra></extra>" : "%{y} · %{x}: %{z:.4g}<extra></extra>",
      colorbar: cat ? { tickvals: ch.categories.map((_, i) => i), ticktext: ch.categories, tickfont: { color: css("--muted") }, thickness: 12 }
                    : { tickfont: { color: css("--muted") }, thickness: 12 },
    }], { showlegend: false, margin: { l: 110, r: 24, t: 18, b: 44 }, shapes, annotations,
          xaxis: { title: { text: ch.x_label } }, yaxis: { type: "category", autorange: "reversed" } });  // rows run top to bottom
    return;
  }
  let auto = 0;
  const traces = ch.series.map(s => {
    const color = s.muted ? css("--rest") : css(SLOTS[(s.slot ?? auto++) % 5]);
    const base = { x: ch.x, y: s.y, name: s.name, hovertemplate: `${esc(s.name)}: %{y:.4g}<extra></extra>` };
    if (s.kind === "bar") return { ...base, type: "bar", marker: { color, line: { color: css("--surface"), width: 1 } } };
    if (s.kind === "markers") return { ...base, mode: "markers", marker: { size: 8, color, line: { width: 2, color: css("--surface") } } };
    return { ...base, mode: "lines", line: { width: s.muted ? 1.5 : 2, color, dash: s.dash }, connectgaps: false };
  });
  plot(el, traces, { hovermode: "x unified", showlegend: ch.series.length > 1, margin: { l: 64, r: 24, t: 18, b: 48 },
                     legend: { orientation: "h", y: ch.x_label ? -0.3 : -0.2, font: { color: css("--ink-2") } },
                     shapes, annotations, bargap: 0.15, xaxis: { title: { text: ch.x_label } }, yaxis: { title: { text: ch.y_label } } });
}
function modelCharts(host, charts) {
  if (!charts.length) return;
  const g = document.createElement("div"); g.className = charts.length > 1 ? "grid2" : ""; host.append(g);
  // Every box first, then the charts: Plotly sizes a chart to its box when drawn, and the
  // grid only settles its columns once all boxes are in.
  const boxes = charts.map(ch => {
    const box = document.createElement("div"); box.style.minWidth = "0"; g.append(box);
    box.insertAdjacentHTML("beforeend", `<h3 class="chart-t">${esc(ch.title)}</h3>`);
    return box;
  });
  charts.forEach((ch, i) => {
    modelChart(boxes[i], ch);
    if (ch.note) boxes[i].insertAdjacentHTML("beforeend", `<p class="note">${esc(ch.note)}</p>`);
  });
}
async function renderModel(key) {
  const e = S.config.engines.find(x => x.key === key) || { name: key };
  const want = store.get(`model:${key}:eco`);
  head(esc(e.name), "reading the model card from the engine…");
  let m, k;
  try {
    [m, k] = await Promise.all([api(`/${key}/model${want ? `?economy=${encodeURIComponent(want)}` : ""}`), loadKatex().catch(() => null)]);
  } catch (err) {
    $("main").innerHTML = ""; head(esc(e.name));
    const missing = /not found/i.test(err.message);
    const b = card(missing ? "No model card yet" : "The engine is not answering", null, null, "placeholder");
    b.innerHTML = `<p class="ink2" style="margin-top:0">${missing
      ? `${esc(e.name)} does not publish <code>GET /model</code> yet. Every engine will: what comes in, each calculation with its formula and charts, what goes out.`
      : esc(err.message)}</p><p class="note">The System page shows which engines run and can start them.</p>`;
    return;
  }
  $("main").innerHTML = "";
  head(esc(m.title), esc(m.summary));
  const bar = document.createElement("div"); bar.className = "filters"; $("main").append(bar);
  bar.innerHTML = `<label>Economy <select id="mEco">${m.economies.map(o => `<option value="${esc(o.code)}"${o.code === m.economy.code ? " selected" : ""}>${esc(o.name)}</option>`).join("")}</select></label>
    <span class="ink2" style="font-size:12px">calibration <b>${esc(m.calibration_version)}</b> · ${esc(m.engine_version)} · ${esc(m.data)}</span>`;
  $("mEco").onchange = () => { store.set(`model:${key}:eco`, $("mEco").value); route(); };

  // 1. what comes in
  const inp = card("1 · What comes in", `The inputs for ${esc(m.economy.name)}, as the engine receives them.`);
  inp.innerHTML = `<div class="scroll"><table><thead><tr><th class="l">Input</th><th class="l">Unit</th><th class="l">Frequency</th><th class="l">Source</th><th class="l">What it is</th></tr></thead><tbody>${
    m.inputs.map(i => `<tr><td class="l"><b>${esc(i.name)}</b><br><code class="muted">${esc(i.key)}</code></td><td class="l">${esc(i.unit)}</td><td class="l">${esc(i.frequency)}</td><td class="l ink2">${esc(i.source)}</td><td class="l ink2">${esc(i.description)}</td></tr>`).join("")}</tbody></table></div>`;
  modelCharts(inp, m.inputs.map(i => ({ title: `${i.name} (${i.unit})`, kind: "xy", x: i.x, x_label: "", y_label: i.unit,
                                          series: [{ name: i.name, y: i.y, kind: "line", dash: "solid", slot: 0, muted: false }], rows: [], z: [], categories: [], projected_from: null, note: "" })));

  // 2. what gets calculated
  $("main").insertAdjacentHTML("beforeend", `<div class="page-head" style="margin-top:8px"><h1 style="font-size:17px">2 · What gets calculated</h1><span class="sub">${m.steps.length} steps, in the order the engine runs them</span></div>`);
  m.steps.forEach((st, n) => {
    const b = card(`2.${n + 1} · ${esc(st.title)}`, esc(st.text));
    if (st.formulas.length) b.insertAdjacentHTML("beforeend", `<div class="tex">${st.formulas.map(f => tex(k, f)).join("")}</div>`);
    if (st.parameters.length) b.insertAdjacentHTML("beforeend", `<div class="scroll"><table class="params"><thead><tr><th class="l">Symbol</th><th class="l">Parameter</th><th class="l">Value</th></tr></thead><tbody>${
      st.parameters.map(p => `<tr><td class="l">${p.symbol ? tex(k, p.symbol, false) : ""}</td><td class="l">${esc(p.name)}</td><td class="l ink2">${esc(p.value)}</td></tr>`).join("")}</tbody></table></div>`);
    modelCharts(b, st.charts);
  });

  // 3. what goes out
  const out = card("3 · What goes out", "What the engine publishes, for every economy and year, and who reads it.");
  out.innerHTML = `<div class="scroll"><table><thead><tr><th class="l">Output</th><th class="l">Unit</th><th class="l">What it is</th></tr></thead><tbody>${
    m.outputs.map(o => `<tr><td class="l"><b>${esc(o.name)}</b><br><code class="muted">${esc(o.key)}</code></td><td class="l">${esc(o.unit)}</td><td class="l ink2">${esc(o.description)}</td></tr>`).join("")}</tbody></table></div>`;
  modelCharts(out, m.output_charts);
  if (m.notes.length) out.insertAdjacentHTML("beforeend", `<ul class="notes">${m.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`);
}
for (const [key, title] of MODELS) page(`model/${key}`, "model", title, () => renderModel(key), { dotFor: key });

// ---------------------------------------------------------------------------------------
// Test benches: the engine's own bench where one exists, a placeholder otherwise
// ---------------------------------------------------------------------------------------
function benchPages() {
  for (const e of [...S.config.engines].sort((p, q) => (p.number ?? 99) - (q.number ?? 99))) {
    page(`bench/${e.key}`, "bench", e.key, () => renderBench(e), { devOnly: true, flush: !!e.bench, dotFor: e.key,
      tag: e.kind === "app" ? "app" : e.bench ? "bench" : (e.key === "datafeed" ? "basic" : e.status === "planned" ? "planned" : e.status) });
  }
}
async function renderBench(e) {
  if (e.kind === "app") return appPage(e);
  if (e.bench) {
    $("main").innerHTML = `<div class="benchbar"><b>${esc(e.name)}</b><span class="muted">${e.key} · ${engNo(e)} · its own test bench, unchanged, calling the engine through <code>/api/${e.key}</code></span><span class="spacer"></span>
      <a class="button" href="/bench/${e.key}/?api=/api/${e.key}" target="_blank" rel="noopener">Open in its own window</a><a class="button" href="${esc(e.docs)}" target="_blank" rel="noopener">API docs</a></div>
      <iframe class="bench" title="${esc(e.name)} test bench" src="/bench/${e.key}/?api=/api/${e.key}"></iframe>`;
    return;
  }
  head(`${esc(e.name)} <span class="muted" style="font-weight:400">(${e.key})</span>`, `${engNo(e)} · ${esc(e.family)} · produces ${esc(e.produces)}`);
  await refreshGraph();
  const n = S.graph && S.graph.nodes.find(x => x.key === e.key);
  if (e.key === "datafeed") return datafeedBench(n);
  const b = card("Test bench", null, null, "placeholder");
  const why = { parked: "The engine is parked mid-build and has no test bench yet. Its API can be exercised in the API explorer while it runs.",
                scaffold: "Scaffold only: folders and README exist, nothing runs yet. The bench arrives with the build.",
                planned: "Not in these repositories yet (built elsewhere or not started). The cockpit already reserves its port and its place in the flow." }[e.status] || "";
  b.innerHTML = `<p class="ink2" style="margin-top:0">${why}</p><div class="row"><span class="pill st-${e.status}">${e.status}</span>${n && n.up ? `<span class="ok">answering on ${esc(e.url)}</span>` : `<span class="muted">not answering on ${esc(e.url)}</span>`}
    <span class="spacer"></span>${n && n.up ? `<a class="button" href="#/system/explorer" onclick="store.set('xeng','${e.key}')">API explorer</a><a class="button" href="${esc(e.docs)}" target="_blank" rel="noopener">API docs</a>` : ""}
    ${e.startable && !(n && n.up) ? `<button type="button" onclick="post('/launcher/${e.key}/start',{}).then(r=>toast(esc(r.action))).catch(x=>toast(esc(x.message)))">Start</button>` : ""}${e.notion ? `<a class="button" href="${esc(e.notion)}" target="_blank" rel="noopener">Engine page</a>` : ""}</div>`;
  if (n && n.up) { const m = card("What it reports", "/health and /meta, as served."); m.innerHTML = `<pre>${esc(JSON.stringify({ health: n.health, meta: n.meta }, null, 2))}</pre>`; }
}
async function datafeedBench(n) {
  const b = card("Basic bench", "datafeed has no test bench of its own; this page reads its registry and snapshots so the feed can be checked without one.");
  if (!(n && n.up)) { b.innerHTML = `<p class="bad">datafeed is not answering on ${esc(n ? n.url : "8001")}.</p>`; return; }
  const [snaps, countries, series] = await Promise.all([api("/datafeed/snapshots"), api("/datafeed/countries"), api("/datafeed/registry/series")]);
  b.innerHTML = `<div class="tiles"><div class="tile"><div class="v">${snaps.length}</div><div class="k">snapshots</div></div><div class="tile"><div class="v">${countries.length}</div><div class="k">countries</div></div><div class="tile"><div class="v">${series.length}</div><div class="k">registered series</div></div></div>`;
  const s = card("Snapshots", "Immutable: a new pull is a new snapshot id.");
  s.innerHTML = `<div class="scroll"><table><thead><tr><th class="l">Snapshot</th><th class="l">Parent</th><th class="l">Source</th><th class="l">As of</th><th class="l">Dates</th><th>Countries</th><th>Series</th><th class="l">Built</th><th class="l"></th></tr></thead><tbody>${
    snaps.map(x => `<tr><td class="l"><code>${esc(x.snapshot_id)}</code>${x.snapshot_id === S.config.cio.snapshot ? ` <span class="pill">CIO default</span>` : ""}</td><td class="l muted"><code>${esc(x.parent_id || "")}</code></td><td class="l ink2">${esc(x.source)}</td><td class="l">${esc(x.as_of)}</td>
      <td class="l">${esc(x.first_date)} to ${esc(x.last_date)}</td><td>${x.countries.length}</td><td>${x.series.length}</td><td class="l muted">${esc((x.built_at || "").replace("T", " ").slice(0, 16))}</td>
      <td class="l"><button type="button" data-cov="${esc(x.snapshot_id)}">Coverage</button></td></tr>`).join("")}</tbody></table></div><div id="covOut"></div>`;
  s.querySelectorAll("[data-cov]").forEach(btn => btn.onclick = async () => {
    btn.disabled = true;
    try { const c = await api(`/datafeed/coverage?snapshot_id=${encodeURIComponent(btn.dataset.cov)}`);
      const gaps = c.rows.filter(r => r.missing > 0).sort((p, q) => q.missing - p.missing);
      $("covOut").innerHTML = `<h3 style="font-size:14px;margin:14px 0 6px">Coverage of <code>${esc(c.snapshot_id)}</code>: ${gaps.length} country series with gaps, ${c.plausibility.length} plausibility findings</h3>
        ${c.plausibility.map(p => `<div class="warn ink2">${esc(p.country)} · ${esc(p.check)}: ${esc(p.detail)}</div>`).join("")}
        <div class="scroll" style="max-height:360px;overflow-y:auto"><table><thead><tr><th class="l">Country</th><th class="l">Series</th><th>Months</th><th>Observed</th><th>Carried</th><th>Missing</th><th>Public</th></tr></thead><tbody>${
        gaps.map(r => `<tr><td class="l">${esc(r.country)}</td><td class="l">${esc(r.series_id)}</td><td>${r.months}</td><td>${r.observed}</td><td>${r.carried}</td><td>${r.missing}</td><td>${r.from_public_sources}</td></tr>`).join("")}</tbody></table></div>`;
    } catch (e) { $("covOut").innerHTML = `<p class="bad">${esc(e.message)}</p>`; } finally { btn.disabled = false; }
  });
  const r = card("Registry", "The one country and series registry every engine reads.");
  r.innerHTML = `<div class="grid2"><div class="scroll" style="max-height:420px;overflow-y:auto"><table><thead><tr><th class="l">Code</th><th class="l">Country</th><th class="l">ISO3</th></tr></thead><tbody>${countries.map(c => `<tr><td class="l">${esc(c.code)}</td><td class="l">${esc(c.name)}</td><td class="l">${esc(c.iso3)}</td></tr>`).join("")}</tbody></table></div>
    <div class="scroll" style="max-height:420px;overflow-y:auto"><table><thead><tr>${Object.keys(series[0] || {}).slice(0, 5).map(k => `<th class="l">${esc(label(k))}</th>`).join("")}</tr></thead><tbody>${series.map(x => `<tr>${Object.values(x).slice(0, 5).map(v => `<td class="l">${esc(typeof v === "object" ? JSON.stringify(v) : v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
}

// ---------------------------------------------------------------------------------------
// start
// ---------------------------------------------------------------------------------------
async function loadSnapshots() {
  try { S.snapshots = await api("/datafeed/snapshots"); } catch { S.snapshots = []; }
  const def = S.config.cio.snapshot, remembered = store.get("snapshot");
  const opts = S.snapshots.map(s => `<option value="${esc(s.snapshot_id)}">${esc(s.snapshot_id)}${s.snapshot_id === def ? " (CIO default)" : s.parent_id ? "" : " (raw)"}</option>`);
  if (!S.snapshots.some(s => s.snapshot_id === def) && def) opts.unshift(`<option value="${esc(def)}">${esc(def)} (datafeed not reachable)</option>`);
  $("snapshot").innerHTML = opts.join("");
  $("snapshot").value = remembered && S.snapshots.some(s => s.snapshot_id === remembered) ? remembered : def;
  // One snapshot is no choice: the selector appears only when datafeed offers more than one (C-25).
  $("snapWrap").classList.toggle("hidden", S.snapshots.length <= 1);
}

async function start() {
  try { S.config = await api("/config"); }
  catch (e) { $("main").innerHTML = ""; problem(e); return; }
  const dev = S.config.mode === "development";
  $("mode").textContent = dev ? "development: CIO views and test benches" : "CIO"; $("mode").className = "badge " + (dev ? "dev" : "cio");
  benchPages(); buildNav();
  await Promise.all([loadSnapshots(), refreshGraph(), curatorInit()]);
  $("snapshot").onchange = () => { store.set("snapshot", $("snapshot").value); S.honi = null; route(); };
  route();
  setInterval(refreshGraph, 30000);
  const beat = () => fetch("/api/launcher/heartbeat", { method: "POST" }).catch(() => {});
  beat(); setInterval(beat, 10000);
}
$("dots").onclick = () => { location.hash = "#/system/engines"; };
$("themeBtn").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches, now = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  document.documentElement.dataset.theme = now === "dark" ? "light" : "dark"; store.set("theme", document.documentElement.dataset.theme); route();
};
if (store.get("theme")) document.documentElement.dataset.theme = store.get("theme");
start();
</script>
