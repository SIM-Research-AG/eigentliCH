<!doctype html>
<!--
  sim-tech cockpit. One front end for the whole system: the CIO workspace (production views),
  the engine status view, and every engine's own test bench (development views), behind one
  origin. Every figure comes from an engine endpoint through the cockpit's /api proxy; the page
  computes nothing (Engine Building Guide: the cockpit contains no maths).

  Plotly from CDN, no build step, no framework (Guide section 3). Colour: the validated default
  palette the honi test bench uses; four categorical slots for the four instrument roles, with
  direct labels and dash patterns as the secondary encoding (validator: all checks pass both
  modes, light contrast WARN relieved by labels and the table). Scores use the one-hue blue ramp.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sim-tech Cockpit</title>
<link rel="icon" href="/favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --hover: rgba(42,120,214,0.06);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --rest: #c3c2b7;
    --div-lo: #e34948; --div-mid: #f0efec; --div-hi: #2a78d6;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
    --band: rgba(42,120,214,0.07); --accent-bg: #eaf1fb; --nav: #f1f0ec;
    --seq: #cde2fb,#9ec5f4,#6da7ec,#3987e5,#256abf,#184f95,#0d366b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --raised: #222221; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --hover: rgba(57,135,229,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --rest: #4a4a47;
      --div-lo: #e66767; --div-mid: #383835; --div-hi: #3987e5; --good-text: #0ca30c;
      --band: rgba(57,135,229,0.10); --accent-bg: #16263a; --nav: #141413;
      --seq: #104281,#184f95,#1c5cab,#256abf,#3987e5,#6da7ec,#b7d3f6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #222221; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --hover: rgba(57,135,229,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --rest: #4a4a47;
      --div-lo: #e66767; --div-mid: #383835; --div-hi: #3987e5; --good-text: #0ca30c;
    --band: rgba(57,135,229,0.10); --accent-bg: #16263a; --nav: #141413;
    --seq: #104281,#184f95,#1c5cab,#256abf,#3987e5,#6da7ec,#b7d3f6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid;
         grid-template-columns: 232px 1fr; grid-template-rows: auto 1fr; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
           padding: 10px 20px; border-bottom: 1px solid var(--grid); background: var(--surface); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; }
  .brand img { width: 26px; height: 26px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--axis);
           color: var(--ink-2); white-space: nowrap; }
  .badge.dev { border-color: var(--s4); } .badge.cio { border-color: var(--s1); }
  .ctx { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-left: auto; font-size: 12px; color: var(--ink-2); }
  .ctx select { max-width: 330px; }
  #dots { display: inline-flex; gap: 3px; align-items: center; cursor: pointer; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rest); display: inline-block; }
  .dot.up { background: var(--good); } .dot.down { background: var(--critical); }
  nav { background: var(--nav); border-right: 1px solid var(--grid); padding: 12px 8px 24px; overflow-y: auto; }
  nav h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 10px 6px; }
  nav a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--ink-2);
          text-decoration: none; font-size: 13px; }
  nav a:hover { background: var(--hover); color: var(--ink); }
  nav a[aria-current="page"] { background: var(--accent-bg); color: var(--ink); font-weight: 600; }
  nav a .tag { margin-left: auto; font-size: 10px; color: var(--muted); }
  nav a .dot { width: 7px; height: 7px; }
  main { overflow-y: auto; padding: 18px 24px 48px; min-width: 0; }
  main.flush { padding: 0; display: flex; flex-direction: column; }
  .page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 12px; }
  .page-head h1 { font-size: 20px; margin: 0; }
  .page-head .sub { color: var(--ink-2); font-size: 13px; }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 14px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
  label.inline { display: inline-flex; align-items: center; gap: 6px; }
  input, select, button, textarea { font: inherit; color: var(--ink); background: var(--raised);
                                    border: 1px solid var(--axis); border-radius: 6px; padding: 5px 9px; }
  textarea { font: 12px ui-monospace, Consolas, monospace; width: 100%; }
  button { cursor: pointer; } button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--s1); color: #fff; border-color: var(--s1); }
  a.button { display: inline-block; text-decoration: none; color: var(--ink); border: 1px solid var(--axis);
             border-radius: 6px; padding: 5px 10px; background: var(--raised); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 16px; margin-bottom: 16px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 2px; }
  .q { color: var(--ink-2); margin: 0 0 10px; font-size: 13px; }
  .note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; }
  .tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .k { color: var(--ink-2); font-size: 12px; }
  .tile .d { color: var(--muted); font-size: 12px; }
  .chart { width: 100%; height: 440px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 8px; border-bottom: 1px solid var(--grid); text-align: right; vertical-align: middle; }
  th { color: var(--ink-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); white-space: nowrap; }
  th.l, td.l { text-align: left; }
  tbody tr:hover { background: var(--hover); }
  tr.sel { background: var(--accent-bg) !important; }
  td input { width: 64px; padding: 3px 6px; text-align: right; }
  td input.wide { width: 180px; text-align: left; }
  td select { padding: 2px 4px; }
  .bar { display: inline-grid; grid-template-columns: 44px 38px; align-items: center; gap: 6px; }
  .bar i { display: block; height: 6px; border-radius: 3px; background: var(--grid); position: relative; overflow: hidden; }
  .bar i b { position: absolute; inset: 0 auto 0 0; background: var(--s1); border-radius: 3px; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--axis); color: var(--ink-2); white-space: nowrap; }
  .st-built { border-color: var(--good); } .st-parked { border-color: var(--s4); }
  .st-scaffold, .st-planned { border-style: dashed; }
  .ok::before { content: "\2713  "; color: var(--good); font-weight: 700; }
  .warn::before { content: "\26A0  "; color: var(--serious); }
  .bad::before { content: "\2716  "; color: var(--critical); }
  .err { border-left: 3px solid var(--critical); }
  .placeholder { border: 1px dashed var(--axis); background: transparent; }
  .placeholder h2::before { content: "Placeholder \00B7  "; color: var(--muted); font-weight: 500; }
  code, pre { font: 12px ui-monospace, Consolas, monospace; }
  pre { background: var(--page); padding: 10px; border-radius: 6px; overflow: auto; max-height: 520px; margin: 0; }
  .muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spacer { flex: 1; }
  .benchbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 16px;
              border-bottom: 1px solid var(--grid); background: var(--surface); font-size: 13px; }
  iframe.bench { flex: 1; width: 100%; border: 0; background: var(--page); }
  .flow svg text { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--raised); border: 1px solid var(--ring);
           border-left: 3px solid var(--s1); border-radius: 8px; padding: 10px 14px; box-shadow: 0 4px 18px rgba(0,0,0,.12);
           max-width: 440px; font-size: 13px; z-index: 10; }
  .hidden { display: none !important; }
  .tex { overflow-x: auto; padding: 2px 0 8px; } .tex .katex-display { margin: .5em 0; text-align: left; }
  .tex .katex-display > .katex { text-align: left; }
  .seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 12px; background: var(--raised); color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--axis); }
  .seg button[aria-pressed="true"] { background: var(--s1); color: #fff; font-weight: 600; }
  .fld { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
  .pill.basis-real { border-color: var(--s3); color: var(--ink); }
  table.params { margin: 4px 0 10px; } table.params td:first-child { white-space: nowrap; }
  h3.chart-t { font-size: 13px; font-weight: 600; margin: 14px 0 0; color: var(--ink-2); }
  ul.notes { margin: 10px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 12.5px; }
  .msg { margin: 6px 0; padding: 7px 10px; border-radius: 8px; background: var(--page); border-left: 3px solid var(--axis); }
  .msg .who { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .msg .body { white-space: pre-wrap; }
  .msg.curator { border-left-color: var(--s1); } .msg.spark7 { border-left-color: var(--s4); }
  .thread { border-top: 1px solid var(--grid); padding: 10px 0; }
  .answer textarea, td textarea { font: inherit; }
  details.qn { border: 1px solid var(--grid); border-radius: 8px; padding: 6px 10px; margin: 6px 0; background: var(--raised); }
  details.qn summary { cursor: pointer; font-size: 13px; }
  details.qn .grid2 { gap: 8px; margin-top: 8px; }
  details.qn input.full, details.qn textarea { width: 100%; }
  .overlay { position: fixed; inset: 4% 6%; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; z-index: 20;
             display: flex; flex-direction: column; box-shadow: 0 8px 40px rgba(0,0,0,.25); }
  .overlay iframe { flex: 1; border: 0; background: #fff; border-radius: 0 0 10px 10px; }
  .checklist { max-height: 260px; overflow-y: auto; border: 1px solid var(--grid); border-radius: 6px; padding: 6px 8px; background: var(--raised); }
  .checklist label { display: flex; flex-direction: row; gap: 6px; align-items: center; color: var(--ink); font-size: 12.5px; }
  table.form td { vertical-align: top; } table.form td:first-child { white-space: nowrap; font-weight: 600; }
  table.form input:not([type=checkbox]), table.form select, table.form textarea { width: 100%; text-align: left; }
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; }
  .presets.mpresets { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .preset { text-align: left; display: grid; gap: 3px; align-content: start; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--grid); background: var(--raised); }
  .preset:hover { border-color: var(--axis); } .preset.sel { border-color: var(--s1); box-shadow: 0 0 0 1px var(--s1) inset; background: var(--accent-bg); }
  .preset b { font-size: 12.5px; } .preset > span { font-size: 11px; color: var(--muted); } .preset svg { display: block; }
  .idchip { color: var(--muted); font-size: 11px; cursor: copy; border-bottom: 1px dotted var(--axis); }
  button.linkish { border: 0; background: none; padding: 0 2px; color: var(--s1); font-size: 12px; text-decoration: underline; }
  .fieldmsg { font-size: 12px; margin-top: 4px; } .fieldmsg:empty { display: none; }
  .origin { font-size: 11.5px; }
  .unigrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .unigrid .checklist { max-height: 320px; } .unigrid .checklist label { align-items: flex-start; }
  .ptgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 4px; margin-top: 6px; }
  .ptgrid input { width: 100%; padding: 3px 5px; }
  details.dim { border-top: 1px solid var(--grid); padding: 6px 0; } details.dim summary { cursor: pointer; }
  table.bounds { max-width: 460px; margin-top: 6px; } table.bounds input { width: 76px; }
  @media (max-width: 820px) { body { grid-template-columns: 1fr; } nav { display: none; } }
  @media print {
    body { display: block; background: #fff; } nav, header .ctx, .noprint, .filters button { display: none !important; }
    main { overflow: visible; padding: 0; } .card { break-inside: avoid; border-color: #ccc; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/static/cockpit.png" alt=""> sim-tech Cockpit</div>
  <span id="mode" class="badge"></span>
  <div class="ctx">
    <label class="inline hidden" id="actingWrap" title="The curator named in every curator write; the database refuses a revoked one">Acting curator <select id="acting"></select></label>
    <label class="inline hidden" id="snapWrap" title="Shown only when datafeed offers more than one snapshot">Snapshot <select id="snapshot"></select></label>
    <span id="dots" title="Engines up (click for the System page)"></span>
    <button id="themeBtn" type="button" title="Switch light / dark">Theme</button>
  </div>
</header>
<nav id="nav" aria-label="Sections"></nav>
<main id="main"></main>
<div id="toast" class="toast hidden" role="status"></div>
<script>
"use strict";
// ---------------------------------------------------------------------------------------
// basics
// ---------------------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem("cockpit." + k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem("cockpit." + k, v); } catch {} } };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 2) => v === null || v === undefined || Number.isNaN(v) ? "n/a" : Number(v).toFixed(d);
const pct = (v, d = 1) => v === null || v === undefined ? "n/a" : (Number(v) * 100).toFixed(d) + "%";
const label = s => String(s).replaceAll("_", " ");
const engNo = e => e.number == null ? "application (no engine number)" : `Engine ${String(e.number).padStart(2, "0")}`;
const SECTORS = [["financial", "Financial", "--s1"], ["international", "International", "--s2"], ["real", "Real", "--s3"]];
const ROLES = [["gain", "--s1", "solid"], ["stabilisation", "--s2", "dash"], ["income", "--s3", "dot"], ["protection", "--s4", "dashdot"]];
const S = { config: null, graph: null, snapshots: [], honi: null, honiP: null, fm: null, fmP: null, decisions: null };

async function api(path, init) {
  let r;
  try { r = await fetch("/api" + path, init); }
  catch { throw new Error("cannot reach the cockpit itself. Start it with start.cmd or the desktop app."); }
  const text = await r.text();
  let body = null; try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (!r.ok) {
    const d = body && body.detail !== undefined ? body.detail : body;
    throw new Error(typeof d === "string" ? d : JSON.stringify(d, null, 1).slice(0, 600));
  }
  return body;
}
const post = (path, data) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
function toast(msg, ms = 4000) { const t = $("toast"); t.innerHTML = msg; t.classList.remove("hidden"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.add("hidden"), ms); }

// ---- page helpers ------------------------------------------------------------------------
function head(title, sub) { $("main").insertAdjacentHTML("beforeend", `<div class="page-head"><h1>${title}</h1>${sub ? `<span class="sub">${sub}</span>` : ""}</div>`); }
function card(title, question, note, cls = "") {
  const c = document.createElement("section"); c.className = "card " + cls;
  c.innerHTML = `${title ? `<h2>${title}</h2>` : ""}${question ? `<p class="q">${question}</p>` : ""}`;
  const body = document.createElement("div"); c.append(body);
  if (note) c.insertAdjacentHTML("beforeend", `<p class="note">${note}</p>`);
  (card.host || $("main")).append(c); return body;
}
function problem(e, where) {
  const b = card("Something is not answering", where || "", null, "err");
  b.innerHTML = `<pre>${esc(e.message || e)}</pre><p class="note">The System page shows which engines are running and can start them.</p>`;
}
function chartIn(host, h) { const d = document.createElement("div"); d.className = "chart"; if (h) d.style.height = h + "px"; host.append(d); return d; }
function layout(extra = {}) {
  const axis = { gridcolor: css("--grid"), linecolor: css("--axis"), zeroline: false, tickfont: { color: css("--muted") }, title: { font: { color: css("--ink-2") } } };
  const merged = Object.assign({
    paper_bgcolor: css("--surface"), plot_bgcolor: css("--surface"),
    font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", color: css("--ink"), size: 12 },
    margin: { l: 56, r: 24, t: 12, b: 48 }, hovermode: "closest", showlegend: true,
    legend: { orientation: "h", y: -0.2, font: { color: css("--ink-2") } },
    hoverlabel: { bgcolor: css("--raised"), bordercolor: css("--axis"), font: { color: css("--ink") } },
  }, extra);
  merged.xaxis = Object.assign({}, axis, extra.xaxis || {}); merged.yaxis = Object.assign({}, axis, extra.yaxis || {});
  return merged;
}
function plot(el, traces, lay) { Plotly.react(el, traces, layout(lay), { displaylogo: false, responsive: true, modeBarButtonsToRemove: ["lasso2d", "select2d"] }); }
const seqScale = () => css("--seq").split(",").map((c, i, a) => [i / (a.length - 1), c.trim()]);
function scoreBar(v) { // presentation only: the bar's length is the published score on its 1 to 5 scale
  if (v === null || v === undefined) return `<span class="muted">n/a</span>`;
  return `<span class="bar"><i><b style="width:${Math.max(0, Math.min(100, (v - 1) * 25))}%"></b></i><span>${fmt(v)}</span></span>`;
}

// ---------------------------------------------------------------------------------------
// data: honi and the Fund Map engine, loaded once per snapshot
// ---------------------------------------------------------------------------------------
async function honi() {
  const snap = $("snapshot").value;
  if (S.honi && S.honi.snapshot === snap) return S.honi;
  if (S.honiP && S.honiP.snapshot === snap) return S.honiP.promise;
  const promise = (async () => {
    // POST /run is idempotent: unchanged inputs are answered from the engine's cache. honi
    // refuses a run while datafeed is down (it checks datafeed's coverage first), so the last
    // artefact read for this snapshot is shown instead, marked as such: it is stored in honi
    // and immutable, only its currency cannot be confirmed.
    let accepted, stale = null;
    try { accepted = await post("/honi/run", { snapshot_id: snap }); }
    catch (e) {
      const last = store.get("honi:" + snap);
      if (!last) throw e;
      accepted = { run_id: last, cached: true }; stale = e.message;
    }
    const run = await api(`/honi/runs/${accepted.run_id}`);
    if (!run.artefact_id) throw new Error(`honi run ${run.run_id} ${run.status}: ${run.error || "no artefact"}`);
    const artefact = await api(`/honi/artefacts/${run.artefact_id}`);
    store.set("honi:" + snap, run.run_id);
    S.honi = { snapshot: snap, run, artefact, peers: null, ranges: null, cached: accepted.cached, stale };
    if (stale) toast(`<span class="warn">honi could not run</span> (${esc(stale.slice(0, 160))}). Showing the stored artefact <code>${esc(artefact.artefact_id)}</code> last read for this snapshot.`, 9000);
    return S.honi;
  })();
  S.honiP = { snapshot: snap, promise };
  try { return await promise; } finally { if (S.honiP && S.honiP.promise === promise) S.honiP = null; }
}
async function peers(h) { if (!h.peers) h.peers = await api(`/honi/peer-stats/${h.artefact.artefact_id}`); return h.peers; }
async function fm() {
  if (S.fm) return S.fm;
  if (S.fmP) return S.fmP;
  S.fmP = (async () => {
    const [register, performance, classification, overlap, returnSet, axis, shapes] = await Promise.all([

// honi's trend and level of every series over a trailing window (GET /trends), per year.
async function trendsFor(h, window, year) {
  const key = `${window}:${year ?? ""}`;
  h.trends ||= {};
  if (!h.trends[key]) h.trends[key] = await api(`/honi/trends/${h.artefact.artefact_id}?window=${window}${year ? `&year=${year}` : ""}`);
  return h.trends[key];
}
const trendOf = (tr, key) => tr && tr.series.find(s => s.key === key);
const colOf = (tr, code) => tr ? tr.countries.findIndex(c => c.code === code) : -1;
function signed(v, d = 2) {
  if (v === null || v === undefined) return "n/a";
  const t = Number(v).toFixed(d);
  return Number(t) === 0 ? Number(0).toFixed(d) : (v > 0 ? "+" : "") + t;  // no "-0.0"
}
// Instruments whose register exposure names this economy (fmre /v1/instruments countries).
const exposedTo = (f, code) => f ? f.register.filter(r => (r.countries || []).includes(code)) : [];

function basisHtml(h) {
  const p = h.artefact.provenance, w = h.run.warnings || [];
  return `<div class="scroll"><table><tbody>${[
    ["Artefact", `<code>${esc(h.artefact.artefact_id)}</code> (run <code>${esc(h.run.run_id)}</code>${h.cached ? ", from the engine's cache" : ""})`],
    ["Snapshot", `<code>${esc(p.snapshot_id)}</code>, data as of ${esc(p.as_of)}`],
    ["Calibration", `${esc(p.calibration_version)} <code>${esc(p.calibration_hash)}</code>`],
    ["Engine", `${esc(p.engine_version)} · ${esc(p.label)}`]].map(([k, v]) => `<tr><td class="l ink2" style="width:130px">${k}</td><td class="l">${v}</td></tr>`).join("")}</tbody></table></div>
    ${h.stale ? `<div class="warn" style="margin-top:8px">honi could not run just now (${esc(h.stale.slice(0, 200))}); this is the stored artefact last read for the snapshot.</div>` : ""}
    ${w.length ? `<div style="margin-top:8px">${w.map(x => `<div class="warn ink2">${esc(x)}</div>`).join("")}</div>` : ""}`;
}

function drawMap(host, a, i, sel) {
  const mcap = a.index_raw.market_cap[i];
  const pts = a.countries.map((c, j) => ({ c, x: a.capital_saturation[i][j], y: a.national[i][j], m: mcap[j] })).filter(p => p.x !== null && p.y !== null);
  const trace = (subset, color, name) => ({ type: "scatter", mode: "markers+text", name, x: subset.map(p => p.x), y: subset.map(p => p.y),
    text: subset.map(p => p.c.code), textposition: "top center", textfont: { color: css("--ink-2"), size: 11 }, customdata: subset.map(p => [p.c.name, p.m]),
    hovertemplate: "<b>%{customdata[0]}</b><br>capital saturation %{x:.2f}<br>HoNI %{y:.2f}<br>market cap %{customdata[1]:.2f} × GDP<extra></extra>",
    marker: { color, size: subset.map(p => 10 + 14 * Math.sqrt(Math.max(p.m || 0, 0))), line: { color: css("--surface"), width: 2 } } });
  const traces = [trace(pts.filter(p => p.c.code !== sel), sel ? css("--rest") : css("--s1"), sel ? "Peer set" : "Peer set")];
  if (sel) traces.push(trace(pts.filter(p => p.c.code === sel), css("--s1"), a.countries.find(c => c.code === sel).name));
  plot(host.querySelector(".chart") || chartIn(host, 460), traces, { showlegend: !!sel,
    xaxis: { title: { text: `Capital saturation (× GDP), ${a.years[i]}` } }, yaxis: { title: { text: "HoNI score" }, range: [0.6, 5.5] },
    shapes: [{ type: "rect", xref: "x", yref: "paper", x0: 2.5, x1: 3.5, y0: 0, y1: 1, fillcolor: css("--band"), line: { width: 0 }, layer: "below" }] });
}

function drawBoundsTable(host, h, i, sel, tr, f) {
  const a = h.artefact, year = a.years[i], prior = i > 0 ? a.years[i - 1] : null;

  const notes = {};
  for (const d of a.coverage.dropped.filter(d => d.year === year))
    (notes[d.country] ||= []).push(`${d.sector} ${d.scored ? "re-weighted" : "unscored"} (missing: ${d.indices_missing.map(label).join(", ")})`);
  const order = a.countries.map((c, j) => ({ c, j, v: a.national[i][j] })).sort((p, q) => (q.v ?? -1) - (p.v ?? -1));

    <div class="scroll"><table id="boundsTable"><thead><tr><th class="l">#</th><th class="l">Country</th><th>HoNI ${year}</th><th>${prior ?? ""}</th>
      <th title="${esc(tr ? tr.definitions.change : "")}">vs ${tr ? tr.base_year : ""}</th><th title="${esc(tr ? tr.definitions.level_z : "")}">Level z</th>
      ${SECTORS.map(([, l]) => `<th>${l}</th>`).join("")}<th>Capital sat.</th><th title="Instruments whose register exposure names this economy">Instr.</th><th class="l">Coverage</th><th>Min %</th><th>Max %</th><th class="l">Note</th></tr></thead><tbody>${
    order.map((p, k) => { const b = bound[p.c.code] || {};
      return `<tr data-code="${p.c.code}" data-name="${esc(p.c.name)}" class="${p.c.code === sel ? "sel" : ""}"><td class="l muted">${p.v === null ? "" : k + 1}</td>
        <td class="l"><a href="#/cio/country" onclick="store.set('country','${p.c.code}')">${esc(p.c.name)}</a> <span class="muted">${p.c.code}</span></td>
        <td>${scoreBar(p.v)}</td><td class="muted">${prior ? fmt(a.national[i - 1][p.j]) : ""}</td>
        <td>${nat ? signed(nat.change[colOf(tr, p.c.code)]) : ""}</td><td>${nat ? signed(nat.level_z[colOf(tr, p.c.code)], 1) : ""}</td>
        ${SECTORS.map(([s]) => `<td>${fmt(a.sectors[s][i][p.j])}</td>`).join("")}<td>${fmt(a.capital_saturation[i][p.j])}</td>
        <td>${f ? `<a href="#/cio/instruments" onclick="store.set('iCountry','${p.c.code}')">${exposedTo(f, p.c.code).length}</a>` : ""}</td>
        <td class="l" style="min-width:220px;max-width:300px">${notes[p.c.code] ? notes[p.c.code].map(n => `<div class="warn ink2" style="font-size:11.5px">${esc(n)}</div>`).join("") : `<span class="muted">complete</span>`}</td>
        <td><input type="number" min="0" max="100" step="0.5" data-f="min_pct" value="${val(b.min_pct)}"></td>
        <td><input type="number" min="0" max="100" step="0.5" data-f="max_pct" value="${val(b.max_pct)}"></td>
        <td class="l"><input class="wide" data-f="note" value="${esc(b.note || "")}"></td></tr>`; }).join("")}</tbody></table></div>
    <div class="row noprint" style="margin-top:12px"><label>Title <input id="bTitle" size="36" value="Optimiser bounds ${new Date().toISOString().slice(0, 10)}"></label>
      <label>Author <input id="bAuthor" size="14" value="${esc(store.get("author") || "CIO")}"></label>
      <label style="flex:1">Note <input id="bNote" style="width:100%" placeholder="Why these bounds (optional)"></label>
      <button class="primary" id="bSave" type="button">Save bounds</button>
      ${saved ? `<a class="button" href="/api/export/decisions/${saved.decision_id}.xlsx">Export last saved (.xlsx)</a>` : ""}</div>`;
  $("bSave").onclick = async () => {
    const rows = [...document.querySelectorAll("#boundsTable tbody tr")].map(tr => {
      const f = k => tr.querySelector(`[data-f="${k}"]`).value.trim();
      return { code: tr.dataset.code, name: tr.dataset.name, min_pct: f("min_pct") === "" ? null : Number(f("min_pct")),
               max_pct: f("max_pct") === "" ? null : Number(f("max_pct")), note: f("note") };
    }).filter(r => r.min_pct !== null || r.max_pct !== null || r.note);
    if (!rows.length) { toast("Enter at least one bound or note before saving."); return; }
    store.set("author", $("bAuthor").value);

      await decisions(true);

      drawBoundsTable(host, h, i, sel);
    } catch (e) { toast(`<span class="bad">Not saved:</span> ${esc(e.message)}`, 8000); }
  };
}

    const box = card(`Spread across the peer set, ${year}`, `How does ${esc(c.country.name)} compare with the spread on each index?`, "Box: quartiles across countries; whiskers: minimum and maximum. Dot: this country.");
    const shown = rows.filter(r => r.n > 0), names = shown.map(r => label(r.index));

        marker: { color: css("--s1"), size: 10, line: { color: css("--surface"), width: 2 } }, hovertemplate: "%{y}: %{x:.2f}<extra></extra>" }],
      { xaxis: { range: [0.8, 5.2], title: { text: "Score" } }, yaxis: { autorange: "reversed", automargin: true }, margin: { l: 190, r: 16, t: 8, b: 48 } });
    card.host = null;

  $("cSel").onchange = () => draw().catch(e => problem(e));
  $("cYear").onchange = () => draw().catch(e => problem(e));
  $("cWin").onchange = () => draw().catch(e => problem(e));
  await draw();
});

page("cio/instruments", "cio", "Instrument selection", async () => {

        api(`/fmre/v1/inflation?${new URLSearchParams({ currency: ccy })}`).catch(e => ({ problem: e.message }))]);
      if (servedBasis(rs) !== "real") throw new Error(`fmre served ${rs.return_set_id} on a ${servedBasis(rs)} basis: it does not serve basis=real yet`);

    <div class="ink2" style="font-size:12.5px;align-self:center">Profiles shown ${basisChip(basis)} ${basis === "real" ? `in <b>${esc(ccy)}</b>, deflated by fmre with ${esc((view.inflation && view.inflation.index) || "the currency's index")}` : "in each series' source currency"} · ReturnSet ${idChip(view.rs.return_set_id)}</div>

  const chip = code => { const j = colOf(htr, code);

// ---- cycle model: where each economy stands in its five cycles -----------------------------
async function cycleState() {
  const snap = $("snapshot").value;
  if (S.cycle && S.cycle.snapshot === snap) return S.cycle;
  const accepted = await post("/cycle/run", { snapshot_id: snap });      // idempotent: cached when unchanged
  const run = await api(`/cycle/runs/${accepted.run_id}`);
  if (!run.artefact_id) throw new Error(`cycle run ${run.run_id} ${run.status}: ${run.error || "no artefact"}`);
  const [artefact, current] = await Promise.all([api(`/cycle/artefacts/${run.artefact_id}`),
                                                 api(`/cycle/cycles/${run.artefact_id}/current`)]);
  S.cycle = { snapshot: snap, run, artefact, current };
  return S.cycle;
}

        text: "projection", showarrow: false, font: { color: css("--muted"), size: 11 } });

    const parts = [];

    if (contSpan) parts.push(`${contSpan[0]} to ${contSpan[1]}: ${listOf(e.anchored_members)} only, weights re-normalised by the engine (dashed)`);

function storeProblem() {
  if (C.status && C.status.ok) return false;
  const b = card("The curator store is not reachable", "The curator pages read and write schema eigentlich as role curator.", null, "err");
  b.innerHTML = `<pre>${esc((C.status && C.status.error) || "unknown")}</pre><p class="note">Password: <code>curator_db.password</code> in cockpit/config.local.yaml, or <code>COCKPIT_CURATOR_DB_PASSWORD</code>. PostgreSQL: <code>docker compose up -d</code> in Projects\\PostgreSQL.</p>`;
  return true;
}
async function act(btn, fn, okMsg) {   // a write from a button: the database's refusal shown as it came
  if (btn) btn.disabled = true;
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(`<span class="bad">${esc(e.message)}</span>`, 9000); return null; }
  finally { if (btn) btn.disabled = false; }
}
async function clientList(force) { if (!C.clients || force) C.clients = await api("/curator/clients"); return C.clients; }
function appLink() { const e = S.config.engines.find(x => x.kind === "app"); return e ? `<a class="button" href="${esc(e.url)}/" target="_blank" rel="noopener">Open the consumer app &#8599;</a>` : ""; }
async function clientBar(target) {   // the client picker at the top of the Client and Parameters pages
  const list = await clientList();
  const id = S.params.get("c") || store.get("curator:client") || (list[0] || {}).id;
  if (!id) { card("No client", "The store holds no client record yet."); return null; }
  store.set("curator:client", id);
  const bar = document.createElement("div"); bar.className = "filters"; $("main").append(bar);
  bar.innerHTML = `<label>Client <select id="cPick">${list.map(c => `<option value="${esc(c.id)}">${esc(c.display_name)} · ${esc(c.id.slice(0, 8))}</option>`).join("")}</select></label>
    <span class="spacer"></span><a class="button" href="#/curator/client?c=${esc(id)}">Client</a><a class="button" href="#/curator/parameters?c=${esc(id)}">Parameters</a>${appLink()}`;
  if (!list.some(c => c.id === id)) $("cPick").insertAdjacentHTML("afterbegin", `<option value="${esc(id)}">${esc(id)}</option>`);
  $("cPick").value = id;
  $("cPick").onchange = () => { location.hash = `#/${target}?c=${encodeURIComponent($("cPick").value)}`; };
  return id;
}
async function viewReport(id) {
  const r = await api(`/curator/reports/${encodeURIComponent(id)}`).catch(e => { toast(esc(e.message)); return null; });
  if (!r) return;
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="benchbar"><b>Report</b><span class="muted">${esc(r.report_artefact_id)} · lbs ${esc(r.lbs_artefact_id || "n/a")} · allocation ${esc(r.allocation_artefact_id || "n/a")} · ${when(r.created_at)}</span><span class="spacer"></span><button type="button">Close</button></div><iframe sandbox="" title="report"></iframe>`;
  document.body.append(o);
  o.querySelector("iframe").srcdoc = r.body_html;
  o.querySelector("button").onclick = () => o.remove();
}
function msgHtml(m) {
  const extra = [];
  if (m.author_kind === "spark7") extra.push(`model <code>${esc(m.model)}</code> · artefact <code>${esc(m.chatbot_artefact_id)}</code>`);
  if ((m.unverified_numbers || []).length) extra.push(`<span class="warn">unverified numbers: ${esc(m.unverified_numbers.map(x => typeof x === "object" ? JSON.stringify(x) : x).join(", "))}</span>`);
  if ((m.sources || []).length) extra.push(`sources: ${esc(m.sources.map(s => typeof s === "object" ? (s.title || s.id || JSON.stringify(s)) : s).join("; "))}`);
  return `<div class="msg ${esc(m.author_kind)}"><div class="who">${who(m.author_kind, m.author_ref, m.author_name)} · ${when(m.created_at)} · ${esc(m.language)}${extra.length ? " · " + extra.join(" · ") : ""}</div><div class="body">${esc(m.body)}</div></div>`;
}
function approvalsHtml(rows, opts = {}) {
  if (!rows.length) return `<p class="muted">${opts.empty || "No approval requests."}</p>`;
  return `<div class="scroll"><table><thead><tr>${opts.withClient ? `<th class="l">Client</th>` : ""}<th class="l">Item</th><th class="l">What the client asks a curator to approve</th><th class="l">Requested</th><th class="l">State</th><th class="l">Decision</th></tr></thead><tbody>${rows.map(a => {
    const item = a.item_kind === "answer" ? `<div class="msg spark7"><div class="who">${AI_NAME} · AI-drafted answer${a.item_model ? ` · model <code>${esc(a.item_model)}</code>` : ""}</div><div class="body">${esc(a.item_body || a.item_id)}</div></div>`
      : `${esc(label(a.item_kind))} ${idChip(a.item_report_artefact_id || a.item_id, 12)} <button type="button" data-view="${esc(a.item_id)}">View</button>`;
    const cands = (opts.reports || []).filter(r => r.request_id === a.item_request_id && r.id !== a.item_id);
    const open = a.state === "awaiting_curator";
    return `<tr data-approval="${esc(a.id)}" data-kind="${esc(a.item_kind)}">${opts.withClient ? `<td class="l"><a href="#/curator/client?c=${esc(a.client_id)}">${esc(a.client_name)}</a></td>` : ""}
      <td class="l">${esc(a.item_kind)}</td><td class="l" style="max-width:520px">${item}${a.request_note ? `<div class="muted">Client's note: ${esc(a.request_note)}</div>` : ""}</td>
      <td class="l">${when(a.created_at)}</td>
      <td class="l"><span class="pill">${esc(label(a.state))}</span>${a.decided_at ? `<div class="muted" style="font-size:11.5px">${when(a.decided_at)}${a.event_note ? ": " + esc(a.event_note) : ""}</div>` : ""}</td>
      <td class="l" style="min-width:300px">${open ? `<input class="note-in" placeholder="Note (optional)" style="width:100%">
        ${a.item_kind === "answer" ? `<textarea class="rev-body" rows="3" placeholder="Corrected answer (for a revision)" style="margin-top:4px"></textarea>`
          : `<select class="rev-item" style="margin-top:4px;width:100%"><option value="">revised report: ${cands.length ? "choose" : "none yet (the backend produces it)"}</option>${cands.map(r => `<option value="${esc(r.id)}">report of ${when(r.created_at)} (${esc(String(r.report_artefact_id).slice(0, 12))})</option>`).join("")}</select>
             ${opts.reports ? "" : `<input class="rev-id" placeholder="or the revised report's id" style="width:100%;margin-top:4px">`}`}
        <div class="row" style="margin-top:6px"><button class="primary" type="button" data-approve>Approve</button><button type="button" data-revise>Send revision</button></div>` : `<span class="muted">decided</span>`}</td></tr>`; }).join("")}</tbody></table></div>`;
}
function wireApprovals(host, done) {
  host.querySelectorAll("tr[data-approval]").forEach(tr => {
    const id = tr.dataset.approval, note = () => ((tr.querySelector(".note-in") || {}).value || "").trim() || null;
    const ap = tr.querySelector("[data-approve]"), rv = tr.querySelector("[data-revise]");
    if (ap) ap.onclick = () => act(ap, () => cpost(`/approvals/${id}/approve`, { note: note() }), "Approved.").then(r => r && done());
    if (rv) rv.onclick = () => act(rv, () => cpost(`/approvals/${id}/revise`, tr.dataset.kind === "answer"
      ? { note: note(), body: tr.querySelector(".rev-body").value }
      : { note: note(), revision_item_id: (tr.querySelector(".rev-item") || {}).value || ((tr.querySelector(".rev-id") || {}).value || "").trim() || null }),
      "Revision sent.").then(r => r && done());
  });
  host.querySelectorAll("[data-view]").forEach(b => b.onclick = () => viewReport(b.dataset.view));
}
function table(rows, cols, empty = "None.") {   // cols: [header, row => html, left?]
  if (!rows.length) return `<p class="muted">${empty}</p>`;
  return `<div class="scroll"><table><thead><tr>${cols.map(([h, , l]) => `<th${l === false ? "" : ' class="l"'}>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(([, f, l]) => `<td${l === false ? "" : ' class="l"'}>${f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

      ["Locale", c => esc(c.locale)], ["Age at registration", c => c.age_at_registration, false],
      ["Created", c => `<span class="ink2">${when(c.created_at).slice(0, 10)} · ${esc(c.created_by_kind)}</span>`],
      ["Onboarding", c => c.onboarding_completed_at ? `<span class="ok">${when(c.onboarding_completed_at).slice(0, 10)}</span>` : `<span class="muted">open</span>`],
      ["Threads waiting", c => badgeN(c.threads_awaiting_answer), false], ["Approvals waiting", c => badgeN(c.approvals_awaiting_curator), false],

page("curator/client", "curator", "Client", async () => {
  if (storeProblem()) { head("Client"); return; }

  const d = await api(`/curator/clients/${encodeURIComponent(id)}`), c = d.client;
  $("main").insertAdjacentHTML("afterbegin", `<div class="page-head"><h1>${esc(c.display_name)}</h1><span class="sub">client ${idChip(c.id)} · ${esc(c.locale)} · age at registration ${c.age_at_registration} · created ${when(c.created_at).slice(0, 10)} (${esc(c.created_by_kind)})${c.archived_at ? " · archived" : ""}${c.onboarding_completed_at ? ` · onboarding completed ${when(c.onboarding_completed_at).slice(0, 10)}` : ""}</span></div>`);
  // C-10 audit: opening a client's material is recorded, once per curator and client per visit

  const cps = d.parameter_sets.find(p => p.engine === "pcp" && p.current);

  const reload = () => { C.clients = null; route(); };

  const th = card("Threads", "The client's questions and the answers so far. A curator answer is a message by the acting curator; closing a thread is final.");
  th.innerHTML = d.threads.length ? d.threads.map(t => `<div class="thread"><div class="row"><b>${esc(t.subject || "(no subject)")}</b><span class="pill">${esc(label(t.state))}</span><span class="muted">${t.message_count} messages${t.last_message_at ? ` · last ${when(t.last_message_at)}` : ""}</span></div>

      ${t.state === "closed" ? `<p class="muted" style="margin:4px 0 0">Closed ${when(t.closed_at)}.</p>` : `<div class="answer" data-thread="${esc(t.id)}"><textarea rows="3" style="width:100%" placeholder="Answer as the acting curator"></textarea>
        <div class="row" style="margin-top:6px"><label class="inline">Language <select class="lang"><option>de</option><option>en</option><option>fr</option><option>it</option></select></label>
        <button class="primary" type="button" data-send>Send answer</button><button type="button" data-sendclose>Send and close</button><span class="spacer"></span><button type="button" data-close>Close thread</button></div></div>`}</div>`).join("")
    : `<p class="muted">No threads.</p>`;
  th.querySelectorAll(".answer").forEach(box => {

  });

  const ap = card("Approval requests", "Only what the client asked a curator to approve. Approve, or send a revision: for an AI-drafted answer the corrected answer goes into the thread; for a report the backend produces the revised report and the curator names it.");
  const reqById = Object.fromEntries(d.report_requests.map(r => [r.id, r]));
  const withItems = d.approvals.map(a => {
    const all = d.threads.flatMap(t => t.messages), m = a.item_kind === "answer" ? all.find(x => x.id === a.item_id) : null;

  const rp = card("Reports and report requests", "Requests by the client (or a curator on their behalf), and the reports produced for them. A further report for the same request is a revision.");
  rp.innerHTML = `<h3 class="chart-t">Requests</h3>${table(d.report_requests, [["Requested", r => when(r.created_at)], ["Kind", r => esc(r.kind)], ["By", r => esc(r.requested_by_kind)],
      ["Language", r => esc(r.language)], ["Note", r => `<span class="ink2">${esc(r.note || "")}</span>`], ["State", r => `<span class="pill">${esc(r.state)}</span>`],
      ["Latest report", r => r.latest_report_id ? `<button type="button" data-view="${esc(r.latest_report_id)}">View</button> ${when(r.latest_report_at)}` : ""]], "No report requests.")}
    <h3 class="chart-t">Reports</h3>${table(d.reports, [["Produced", r => when(r.created_at)], ["Report", r => idChip(r.report_artefact_id, 12)],
      ["Request", r => esc((reqById[r.request_id] || {}).kind || r.request_id)], ["Balance sheet", r => idChip(r.lbs_artefact_id, 12)],
      ["Allocation", r => idChip(r.allocation_artefact_id, 12)], ["", r => `<button type="button" data-view="${esc(r.id)}">View</button>`]], "No reports.")}`;
  rp.querySelectorAll("[data-view]").forEach(b => b.onclick = () => viewReport(b.dataset.view));

  const an = card("Answers", "Current answers, each with the questionnaire version it answered; a newer version of the questionnaire does not change an answer.", "K3: health or documentary data (the question declares it).");
  const byQ = {}; d.answers.forEach(a => (byQ[a.questionnaire_key] ||= []).push(a));
  an.innerHTML = Object.keys(byQ).length ? Object.entries(byQ).map(([k, rows]) => `<h3 class="chart-t">${esc(k)} <span class="muted" style="font-weight:400">${rows.length} answers</span></h3>${table(rows, [

  pl.innerHTML = `<h3 class="chart-t">Household</h3>${hh || '<p class="muted">No household stated.</p>'}
    <h3 class="chart-t">Positions</h3>${table(d.positions, [["Label", p => `${esc(p.label)}${p.active ? "" : ' <span class="muted">(inactive)</span>'}${p.description ? `<div class="muted" style="font-size:11.5px">${esc(p.description)}</div>` : ""}`],
      ["Role", p => esc(p.role)], ["Capital", p => esc(p.capital_type)], ["Magnitude", p => p.magnitude === null ? '<span class="muted">n/a</span>' : Number(p.magnitude).toLocaleString("de-CH"), false],
      ["Unit", p => esc(p.magnitude_unit || "")], ["Stock", p => esc(p.stock_kind || "")], ["Liquidity", p => esc(p.liquidity || "")]], "No positions.")}
    <h3 class="chart-t">Goals</h3>${table(d.goals, [["Goal", g => `${esc(g.name)}${g.active ? "" : ' <span class="muted">(inactive)</span>'}`], ["Target", g => g.target_amount === null ? '<span class="muted">n/a</span>' : Number(g.target_amount).toLocaleString("de-CH"), false],

    <h3 class="chart-t">Facts</h3>${table(d.facts, [["Fact", f => esc(label(f.stated_key))], ["Value", f => `${show(f.stated_value)}${f.data_class === 3 ? ' <span class="pill">K3</span>' : ""}`],
      ["Stated", f => `${esc(f.stated_on)} by ${esc(f.stated_by)}`]], "No facts.")}`;

  const er = card("Parameter sets and engine runs", "Finalised engine inputs (append-only, each superseding the previous) and every call to an engine on the client's behalf.");

    <div id="cLbsOut"></div>
    ${table(d.parameter_sets, [["Finalised", p => when(p.finalised_at)], ["Engine", p => `${esc(p.engine)} <span class="muted">${esc(p.contract_version)}</span>`],
      ["By", p => esc(p.finalised_by_name || p.finalised_by)], ["State", p => p.current ? '<span class="ok">current</span>' : '<span class="muted">superseded</span>'],
      ["Mandate", p => esc(p.body.name || "")], ["Note", p => `<span class="ink2">${esc(p.note || "")}</span>`]], "No parameter set finalised.")}
    <h3 class="chart-t">Engine runs</h3><div id="cRuns">${runsTable(d.engine_runs)}</div>`;
  wireRuns(er, reload);
  // lbs on demand (C-20): the consumer app builds the request from the client's data and records the
  // engine_run; the cockpit only asks, and shows what the app recorded and returned.
  $("cLbs").onclick = () => act($("cLbs"), async () => {
    $("cLbsOut").innerHTML = `<p class="muted">Computing the balance sheet through the consumer app…</p>`;

    const fresh = await api(`/curator/clients/${encodeURIComponent(id)}`).catch(() => null);

  }).catch(e => { oc.innerHTML = `<p class="bad">${esc(e.message)}</p>`; });
});
function lbsOutcome(r, id) {   // what the app recorded and returned for an on-demand lbs run

async function outlookPanel(host, clientId, d, runsChanged) {   // the client's newest sheet, read through the proxy
  const sheetRun = d.engine_runs.find(r => r.engine === "lbs" && r.status === "succeeded" && r.artefact_id);
  host.innerHTML = `<div class="row" style="margin-bottom:6px"><button type="button" class="primary" id="oRestart" title="A priority plan run for the client's newest sheet, asked for through the consumer app, which records it as the acting curator's">${esc(ow("restart"))}</button>
      <button type="button" id="oCompute" title="Findings and simulated paths for the newest sheet, asked for through the consumer app">${esc(ow("compute"))}</button><span id="oMsg" class="ink2"></span></div><div id="oBody"></div>`;
  const body = $("oBody"), view = { basis: DEFAULT_BASIS, regime: "base", series: null };
  view.withheld = withheldIn(sheetRun && sheetRun.request);   // K3: the principal's health over time is not drawn
  const read = async () => {
    if (!sheetRun) { body.innerHTML = `<p class="muted">No balance sheet yet: compute it first (Parameter sets and engine runs, below). The outlook is computed for the newest sheet.</p>`; return; }
    body.innerHTML = `<p class="muted">Reading the outlook from lbsim…</p>`;

    catch (e) { body.innerHTML = `<p class="warn">lbsim has no outlook to show for the newest balance sheet: ${esc(e.message)}</p>`; return; }
    drawOutlook(body, o, view);
  };
  // Through the app only (C-20 pattern): the app builds the lbsim request and records the engine_run rows.
  const ask = (btn, optimise) => act(btn, async () => {
    $("oMsg").textContent = optimise ? "Asking the app for a new plan calculation…" : "Asking the app for the outlook…";
    let r;
    try { r = optimise ? await cpost(`/clients/${encodeURIComponent(clientId)}/outlook`, { optimise: "now" }) : await cpost(`/clients/${encodeURIComponent(clientId)}/outlook`); }
    catch (e) { $("oMsg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; throw e; }
    const runs = r.engine_runs || [];
    $("oMsg").innerHTML = `${r.error ? `<span class="bad">${esc(r.error)}</span> ` : ""}${runs.length ? `Recorded by the app: ${runs.map(x => `${esc(x.status)} ${idChip(x.id)}`).join(", ")}.` : "The app recorded no new run (the outlook was already there)."}`;
    await read();
    if (runsChanged) runsChanged();
  }, null).catch(() => {});
  $("oRestart").onclick = () => ask($("oRestart"), true);
  $("oCompute").onclick = () => ask($("oCompute"), false);
  await read();
}

// ---- the life balance sheet and the four capitals (C-36, VISUALS_INTERFACES.md) --------------------------
// The balance sheet as a graph from the client's newest lbs sheet (read through the proxy): the assets by vessel
// and the human capital, the debts with the net worth, and the goals' claims in the basis the panel's switch shows
// (lbs's real view; today's stocks are the same on both). The four capitals per adult today: wealth in francs as
// words (lbs states it for the household), expertise, network and health as lbs's levels on 0 to 1. Over time, in

// capital on its own scale with words at both ends, never on a money axis; wealth over time stays the fan. The

  ["pillar_3a", { de: "Säule 3a", en: "Pillar 3a" }, "--s3"], ["real_asset", { de: "Sachwerte", en: "Real assets" }, "--s5"],
  ["not_stated", { de: "ohne Angabe des Gefässes", en: "Vessel not stated" }, "--rest"]];

function balanceSheetChart(el, sheet, basis, goalName) {

// ---- Parameters: the pcp mandate --------------------------------------------------------
// The form is in the units people read: percent of the portfolio, percent per year. The cockpit's
// /curator/mandate/assemble turns it into pcp's Mandate (fractions, the curve as ln(1 + p/100)) and
// names each field it cannot convert (C-21). Presets are content in the store
// (reference/target-curve-presets, reference/mandate-presets, C-22): the page draws them, and adds a
// level shift and a slope tilt for the live preview with the same arithmetic the server applies on
// save. The Regime is the current one or one of aggregation's scenario Regimes (C-23); the ReturnSet
// is fetched from fmre in the mandate's currency (C-23).
const PCP_CONTRACT = "pcp-mandate@1.0.0";
function stripReasoning(bounds) {   // lbs explains each proposed bound; pcp's Bound takes lower and upper only
  return Object.fromEntries(Object.entries(bounds || {}).map(([dim, cats]) => [dim, Object.fromEntries(Object.entries(cats).map(([k, v]) => [k, { lower: v.lower, upper: v.upper }]))]));
}
const SCENARIO_POLICIES = [["depression", "Depression"], ["hyperinflation", "Hyperinflation"], ["stagflation", "Stagflation"], ["deferral", "Deferral"]];
const DIM_LABEL = { currency: "Currency", region: "Region", role: "Role", capital_type: "Capital type", liquidity: "Liquidity", phase: "Economic phase", asset_class: "Asset class" };
const ROLE_LABEL = { gain: "Gain", income: "Income", stabilisation: "Stabilisation", protection: "Protection" };
const FIELD_LABEL = { universe: "Universe", max_single_position: "Largest single position", regime_weights: "Regime blend", regime_market: "Regime blend",
  target_curve: "Target curve", esg_min: "ESG floor", fixed_allocations: "Fixed allocations", "bounds.role": "Role bounds", "bounds.currency": "Currency bounds",
  "bounds.liquidity": "Liquidity bounds", "bounds.region|capital_type|phase|asset_class": "Policy bounds (region, capital type, phase, asset class)" };
const fieldName = f => FIELD_LABEL[f] || label(String(f).replace(/^bounds\./, "") + (String(f).startsWith("bounds.") ? " bounds" : ""));
const adjustCurve = (base, shift, tilt) => base.map((p, i) => p + shift + tilt * ((i + 1) - 13) / 12);   // the preview of what /mandate/assemble applies (C-21)
const pp = v => `${v > 0 ? "+" : v < 0 ? "−" : "±"}${Math.abs(v).toFixed(1)} pp`;
function spark(points, lo, hi, w = 150, h = 42) {   // chart geometry only (C-07): the preset's stored points drawn
  const x = i => 2 + i * (w - 4) / (points.length - 1), y = v => h - 3 - (v - lo) / ((hi - lo) || 1) * (h - 6);
  const zero = lo < 0 && hi > 0 ? `<line x1="0" x2="${w}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--axis)" stroke-dasharray="2 2"/>` : "";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${zero}<polyline fill="none" stroke="var(--s1)" stroke-width="1.7" points="${points.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}"/></svg>`;
}
// aggregation issues one Regime per optimism level in one go; the page picks by level, default unless
// the curator chooses another, never aggregation's newest run (C-30). aggregation names no labels for
// the levels (model card, calibration), so the label is the level's name.
const OPTIMISM_LEVELS = [["defensive", "Defensive"], ["default", "Default"], ["aggressive", "Aggressive"], ["rogue", "Rogue"]];
function regimeMemo(rid, info) {   // a Regime's optimism level, and the policy a scenario Regime was derived under, remembered in this browser
  if (info) store.set("regime:" + rid, JSON.stringify(info));
  try { return JSON.parse(store.get("regime:" + rid) || "null"); } catch { return null; }
}
function regimeText(m) {   // "Regime: default optimism, scenario stagflation"
  const lvl = m && m.optimism ? `<b>${esc(m.optimism)}</b> optimism` : `<span class="muted">optimism level unknown</span>`;
  return `Regime: ${lvl}, ${m && m.policy ? `scenario <b>${esc(label(m.policy))}</b>` : "no scenario"}`;
}
async function regimeLabel(rid, ctx) {
  if (!rid) return `<span class="muted">no Regime</span>`;
  let m = regimeMemo(rid);
  if (ctx && ctx.regime_id === rid && ctx.optimism) m = { ...(m || {}), optimism: ctx.optimism, policy: ctx.regime_policy || (m && m.policy) || null, base_regime_id: ctx.base_regime_id || (m && m.base_regime_id) || null };
  if (!m || !m.optimism) {   // aggregation says itself which level a Regime is, and which policy a scenario Regime carries
    try {
      const cur = await api(`/aggregation/regime/${encodeURIComponent(rid)}/current`);
      const pol = cur.policy || (cur.scenario && cur.scenario.policy) || (cur.provenance && cur.provenance.policy) || null;
      m = { ...(m || {}), optimism: cur.optimism_scale || null, policy: pol || (m && m.policy) || null,
            base_regime_id: cur.base_regime_id || (cur.scenario && cur.scenario.base_regime_id) || (m && m.base_regime_id) || null };
      regimeMemo(rid, m);
    } catch { /* keep what is remembered */ }
  }
  return `${regimeText(m)} ${idChip(rid)}${m && m.policy && m.base_regime_id ? ` <span class="muted">derived from</span> ${idChip(m.base_regime_id)}` : ""}`;
}

      if (p.currency) { f.currency = P.lbs.currency; kept.push("currency"); }
      if (p.esg_min !== null && p.esg_min !== undefined) { f.esg_min = P.lbs.esg_min; kept.push("ESG floor"); }
      Object.keys(p.bounds || {}).forEach(dim => { f.bounds_pct[dim] = JSON.parse(JSON.stringify(P.lbs.bounds_pct[dim])); kept.push(`${(DIM_LABEL[dim] || dim).toLowerCase()} bounds`); });
      if (cp && p.required_return !== null && p.required_return !== undefined && F.basis === "real") kept.push("not the curve's level (lbs's required return is nominal, the mandate real)");
      else if (cp && p.required_return !== null && p.required_return !== undefined) { shift = Math.round((p.required_return * 100 - cp.mean_pct) * 100) / 100; kept.push("the curve's level (the required return)"); }
    }
    f.name = mp.name; f.basis = F.basis;   // a preset is nominal data; it takes the switch as it stands (C-31)
    drawAll(f, `the preset “${mp.name}”`);
    P.preset = mp.key;
    startCard.querySelectorAll("[data-mp]").forEach(b => b.classList.toggle("sel", b.dataset.mp === mp.key));
    if (cp) setCurve(cp.points_pct.slice(), cp.key, cp.name, shift, mp.curve_tilt_pp || 0); else setCurve(f.curve.points_pct, null, "preset curve");
    if (kept.length) $("pStartInfo").insertAdjacentHTML("beforeend", ` Kept from lbs: ${esc(kept.join(", "))}.`);
    if (mp.validation && mp.validation.ok === false) $("pStartInfo").insertAdjacentHTML("beforeend", `<div class="warn">When it was built, pcp found problems with this preset: ${esc((mp.validation.problems || []).join("; "))}</div>`);
  }
  startCard.querySelectorAll("[data-mp]").forEach(b => b.onclick = () => applyPreset(mandates.find(m => m.key === b.dataset.mp)).catch(e => toast(`<span class="bad">${esc(e.message)}</span>`)));
  const fromProposal = p => ({ client: p.client, name: p.name, currency: p.currency, horizon_years: p.horizon_years, curve_unit: p.curve_unit, target_curve: p.target_curve || [],
    universe: p.universe || [], max_single_position: p.max_single_position, esg_min: p.esg_min ?? 0, fixed_allocations: p.fixed_allocations || {},
    bounds: stripReasoning(p.bounds), regime_weights: p.regime_weights, regime_market: p.regime_market });
  const loadProposal = async () => {
    const aid = $("pLbs").value.trim(); P.proposal = null; P.lbs = null;
    if (!aid) { $("pSrcInfo").innerHTML = `<p class="muted">No lbs run is recorded for this client. Compute the balance sheet on the Client page, or enter a LifeBalanceSheet id.</p>`; drawBasis(); return; }
    try {
      const a = await api(`/lbs/artefacts/${encodeURIComponent(aid)}`);
      store.set("lbs:" + id, aid); P.proposal = a.mandate_proposal;
      if (P.proposal && P.proposal.status === "available") P.lbs = await toForm(fromProposal(P.proposal));
      $("pSrcInfo").innerHTML = `<p class="${P.lbs ? "ok" : "warn"}">Life Balance Sheet ${idChip(a.artefact_id)} as of ${esc(a.as_of)}: ${P.lbs ? `a mandate proposal for the goal <b>${esc(goalName(P.proposal))}</b>${P.proposal.required_return !== null && P.proposal.required_return !== undefined ? `, required return ${fmt(P.proposal.required_return * 100, 2)} % a year` : ""}; ${(P.proposal.curator_to_fill || []).length} fields are left to the curator.` : "no mandate proposal."}</p>`;
    } catch (e) { $("pSrcInfo").innerHTML = `<p class="bad">lbs: ${esc(e.message)}</p>`; }
    drawBasis();
  };
  const goalName = p => { const g = d.goals.find(x => x.id === p.goal_id); return g ? g.name : label(p.goal_kind || "goal"); };
  $("pLoad").onclick = async () => { await loadProposal(); if (P.lbs) await fromMandate(fromProposal(P.proposal), "the lbs proposal", { base: P.lbs.curve.points_pct, preset: null, label: "lbs proposal", shift: 0, tilt: 0 }); };
  $("pFromCur").onclick = () => current && fromMandate(current.body, `the current parameter set (finalised ${when(current.finalised_at).slice(0, 10)})`).catch(e => toast(esc(e.message)));
  $("pFromLbs").onclick = () => P.lbs ? fromMandate(fromProposal(P.proposal), "the lbs proposal", P.lbs.curve.points_pct ? { base: P.lbs.curve.points_pct, preset: null, label: "lbs proposal", shift: 0, tilt: 0 } : null) : toast("No lbs proposal loaded: load one under Start from.");
  $("pFromBlank").onclick = () => { drawAll({ client: id, name: "", currency: "CHF", basis: F.basis, horizon_years: 1, curve: { points_pct: null }, universe: [], max_single_position_pct: null, esg_min: 0, fixed_allocations_pct: {}, bounds_pct: {}, regime_market: null, regime_weights_pct: null }, "an empty mandate"); setCurve(null, null, ""); };

  const basis = card("What the lbs proposal rests on", "As lbs published it; nothing here is recomputed.");
  function drawBasis() {
    const p = P.proposal;
    if (!p) { basis.innerHTML = `<p class="muted">No lbs proposal loaded.</p>`; return; }
    if (p.status !== "available") { basis.innerHTML = `<p class="warn">lbs could not propose a mandate: ${esc(p.reason ? label(p.reason) : JSON.stringify(p))}.</p>`; return; }
    const rows = Object.entries(p.bounds || {}).flatMap(([dim, cats]) => Object.entries(cats).map(([k, v]) => ({ dim, k, ...v })));
    const chf = v => v === null || v === undefined ? `<span class="muted">n/a</span>` : `CHF ${Number(v).toLocaleString("de-CH", { maximumFractionDigits: 0 })}`;
    basis.innerHTML = `<div class="scroll"><table><tbody>${[["Goal", `<b>${esc(goalName(p))}</b> <span class="muted">${esc(label(p.goal_kind || ""))}</span> ${idChip(p.goal_id)}`], ["Target basis", esc(label(p.target_basis || ""))], ["Target", chf(p.target_chf)],
        ["Goal horizon", p.goal_horizon_years === null || p.goal_horizon_years === undefined ? "n/a" : `${fmt(p.goal_horizon_years, 1)} years`], ["Drawable wealth", chf(p.drawable_chf)], ["Yearly contribution", chf(p.annual_contribution)],
        ["Required return", p.required_return === null || p.required_return === undefined ? `<span class="muted">none: the goal is not reachable at any return searched</span>` : `${fmt(p.required_return * 100, 2)} % a year`], ["Reachable", p.feasible === null || p.feasible === undefined ? "n/a" : p.feasible ? "yes" : "no"],
        ["Curve shape", esc((p.curve_shape && p.curve_shape.why) || "")], ["Complete", p.complete ? "yes" : "no: some fields are the curator's"]]
        .map(([k, v]) => `<tr><td class="l ink2" style="width:190px">${k}</td><td class="l">${v}</td></tr>`).join("")}</tbody></table></div>
      <h3 class="chart-t">Proposed bounds and why</h3>${table(rows, [["Dimension", r => esc(DIM_LABEL[r.dim] || label(r.dim))], ["Bucket", r => esc(r.k)], ["Lower", r => pct(r.lower, 0), false], ["Upper", r => pct(r.upper, 0), false], ["Why", r => `<span class="ink2">${esc(r.reasoning)}</span>`]], "lbs proposed no bounds.")}
      <h3 class="chart-t">Left to the curator</h3>${table(p.curator_to_fill || [], [["Field", x => esc(fieldName(x.field))], ["Why", x => `<span class="ink2">${esc(x.reason)}</span>`]], "Nothing.")}
      ${(p.notes || []).length ? `<ul class="notes">${p.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}`;
  }

  // ---- 8 · validate, finalise, run ----------------------------------------------------------
  const actions = card("8 · Validate, finalise, run", "Validate asks pcp whether the mandate is plausible and feasible against the Regime and ReturnSet above (nothing is stored). Finalise saves it as the client's parameter set, superseding the current one. Run pcp runs the current finalised set, not unsaved edits, and records the run with the client.");
  actions.innerHTML = `<div class="row"><input id="pNote" placeholder="Note for the parameter set (e.g. conversation of 29.09.2026)" style="flex:1;min-width:260px">
      <button type="button" id="pVal">Validate</button><button type="button" class="primary" id="pFin">Finalise</button><button type="button" id="pRun"${current ? "" : " disabled title=\"finalise a mandate first\""}>Run pcp</button></div>
    <details style="margin-top:6px"><summary class="muted" style="cursor:pointer">The mandate as pcp receives it (JSON)</summary><pre id="pJson" class="muted">Validate or finalise to see it.</pre></details>
    <div id="pOut" style="margin-top:10px"></div>`;
  const out = html => { $("pOut").innerHTML = html; };
  const outlookAfterPcp = cid => {   // through the app, which builds the lbsim request and records the engine_run rows
    $("pOut").insertAdjacentHTML("beforeend", `<p class="muted" id="pOutlook">Asking the consumer app for the client's outlook (lbsim) on this Allocation…</p>`);
    cpost(`/clients/${encodeURIComponent(cid)}/outlook`).then(r => {
      const runs = r.engine_runs || [];
      $("pOutlook").outerHTML = `<p class="${r.error ? "bad" : "ok"}">Outlook (lbsim): ${r.error ? esc(r.error) : runs.length ? `recorded by the app, ${runs.map(x => `${esc(x.status)} ${idChip(x.id)}`).join(", ")}` : "the app recorded no new run"}. The Client page shows it.</p>`;
    }).catch(e => { const el = $("pOutlook"); if (el) el.outerHTML = `<p class="warn">Outlook (lbsim) not asked for: ${esc(e.message)}</p>`; });
  };
  const ids = () => ({ regime_id: $("pReg").value.trim(), return_set_id: $("pRs").value.trim(), ...($("pSpeed").value ? { speed_mode: $("pSpeed").value } : {}), ...($("pDate").value.trim() ? { date: $("pDate").value.trim() } : {}) });
  const curveNote = () => P.curve.base ? `curve ${P.curve.label || "custom"}${P.curve.shift ? ` ${pp(P.curve.shift)}` : ""}${P.curve.tilt ? `, tilt ${pp(P.curve.tilt)}` : ""}` : "";
  $("pVal").onclick = () => act($("pVal"), async () => {
    const mandate = await assembled(); $("pJson").textContent = JSON.stringify(mandate, null, 1);
    const body = { ...ids(), mandate };
    if (!body.regime_id || !body.return_set_id) throw new Error("Validation needs the Regime and the ReturnSet (section 2).");
    const v = await post("/pcp/validate", body);
    if (v.ok) { clearMsgs(); out(`<p class="ok">pcp: feasible. ${v.universe_size} instruments, ${v.constraint_rows} constraint rows, Regime month ${esc(v.date || "latest")}.</p>`); }
    else {
      const rest = showProblems((v.problems || []).map(p => ({ field: fieldOf(p), message: p })), "pcp");
      out(`<div class="warn"><b>pcp found ${(v.problems || []).length} problem${(v.problems || []).length > 1 ? "s" : ""}</b>, shown next to the fields${rest.length ? ":" : "."}</div>${rest.map(p => `<div class="bad">${esc(p.message)}</div>`).join("")}`);
    }
    if ((v.notes || []).length) $("pOut").insertAdjacentHTML("beforeend", v.notes.map(n => `<p class="note">${esc(n)}</p>`).join(""));
  }).catch(() => {});
  $("pFin").onclick = () => act($("pFin"), async () => {
    const mandate = await assembled(); $("pJson").textContent = JSON.stringify(mandate, null, 1);
    const typed = $("pNote").value.trim(), auto = [P.preset ? `preset ${(mandates.find(m => m.key === P.preset) || {}).name}` : "", curveNote()].filter(Boolean).join("; ");
    const r = await cpost(`/clients/${encodeURIComponent(id)}/parameter-sets`, { engine: "pcp", contract_version: PCP_CONTRACT, body: mandate, note: [typed, auto].filter(Boolean).join(" · ") || null });
    toast(`Finalised the mandate “${esc(mandate.name)}”${r.supersedes_id ? ", superseding the previous set" : " (the first for this client)"}.`);
    reload();
  });
  $("pRun").onclick = () => act($("pRun"), async () => {
    const b = ids();
    if (!b.regime_id || !b.return_set_id) throw new Error("A run needs the Regime and the ReturnSet (section 2).");
    const memo = P.regime.id === b.regime_id ? { policy: P.regime.policy, base_regime_id: P.regime.policy ? P.regime.base : null, optimism: P.regime.optimism } : (regimeMemo(b.regime_id) || {});
    const run = await cpost(`/clients/${encodeURIComponent(id)}/runs`, { engine: "pcp", parameter_set_id: current.id, ...b, currency: (P.rs && P.rs.id === b.return_set_id ? P.rs.currency : $("mCur").value),
      basis: (P.rs && P.rs.id === b.return_set_id ? P.rs.basis : F.basis) || DEFAULT_BASIS,
      ...(memo.optimism ? { optimism: memo.optimism } : {}), ...(memo.policy ? { regime_policy: memo.policy, base_regime_id: memo.base_regime_id || null } : {}) });
    out(`<p class="${run.status === "succeeded" ? "ok" : run.status === "failed" ? "bad" : "warn"}">pcp run ${esc(run.status)}${run.error ? `: ${esc(run.error.slice(0, 600))}` : ""}. ${run.context ? `${regimeText({ optimism: run.context.optimism, policy: run.context.regime_policy })} ${idChip(run.context.regime_id)}. ` : ""}${run.context && run.context.basis ? `Basis ${basisChip(run.context.basis)}. ` : ""}Recorded with the client ${idChip(run.id)}.</p>`);
    if (run.artefact_id) await showAllocation(run.artefact_id, run.context);
    // A succeeded run on a base Regime (no scenario policy) gives lbsim a new Allocation: ask the app for the
    // client's outlook (C-34). A scenario Regime's Allocation is never lbsim's base (LBSIM-14): no call.
    if (run.status === "succeeded" && !(run.context && run.context.regime_policy)) outlookAfterPcp(id);
  });

  // ---- history and the allocation --------------------------------------------------------------
  const hist = card("History", "The client's mandates for pcp, newest first, and its engine runs.");
  hist.innerHTML = `${table(d.parameter_sets.filter(p => p.engine === "pcp"), [["Finalised", p => when(p.finalised_at)], ["By", p => esc(p.finalised_by_name || "")],
      ["State", p => p.current ? '<span class="ok">current</span>' : '<span class="muted">superseded</span>'], ["Mandate", p => `<b>${esc(p.body.name || "")}</b> <span class="muted">${esc(p.body.currency || "")}</span> ${basisChip(p.body.basis || DEFAULT_BASIS)}`],
      ["Universe", p => (p.body.universe || []).length, false], ["Note", p => `<span class="ink2">${esc(p.note || "")}</span>`],
      ["", p => `<button type="button" data-load="${esc(p.id)}">Load into the form</button>`]], "No parameter set finalised.")}
    <h3 class="chart-t">Engine runs</h3>${runsTable(d.engine_runs)}`;
  hist.querySelectorAll("[data-load]").forEach(b => b.onclick = () => { const p = d.parameter_sets.find(x => x.id === b.dataset.load); fromMandate(p.body, `the set finalised ${when(p.finalised_at).slice(0, 10)}`).then(() => basics.parentElement.scrollIntoView({ behavior: "smooth" })); });
  wireRuns(hist, reload);
  const allocHost = card("Allocation", "What pcp returned: weights as pcp published them (unreleased), and what they were computed under.", null, "hidden");
  async function showAllocation(aid, ctx) {
    allocHost.parentElement.classList.remove("hidden");
    try {
      const a = await api(`/pcp/allocation/${encodeURIComponent(aid)}`);
      const run = d.engine_runs.find(r => r.artefact_id === aid), req = (run && run.request) || {};
      const currency = (ctx && ctx.currency) || (req.mandate && req.mandate.currency) || null;
      const abasis = a.basis || (ctx && ctx.basis) || (req.mandate && (req.mandate.basis || DEFAULT_BASIS)) || null;   // pcp's Allocation states it; else the run's
      if (ctx && (ctx.regime_policy || ctx.optimism) && ctx.regime_id === a.regime_id) regimeMemo(a.regime_id, { ...(regimeMemo(a.regime_id) || {}), optimism: ctx.optimism || null, policy: ctx.regime_policy || null, base_regime_id: ctx.base_regime_id || null });
      const held = a.instruments.filter(i => i.weight > 0).sort((p, q) => q.weight - p.weight);
      allocHost.innerHTML = `<div class="tiles"><div class="tile"><div class="v" style="font-size:16px">${await regimeLabel(a.regime_id, ctx)}</div><div class="k">computed under · Regime month ${esc(a.date)}</div></div>
          <div class="tile"><div class="v">${currency ? esc(currency) : `<span class="muted">n/a</span>`}</div><div class="k">currency${currency ? "" : " (no recorded run names it)"} · basis ${abasis ? basisChip(abasis) : `<span class="muted">not stated</span>`} · ReturnSet ${idChip(a.return_set_id)}</div></div>
          <div class="tile"><div class="v">${a.budget_met ? "met" : "not met"}</div><div class="k">budget (raw weight sum ${fmt(a.raw_weight_sum, 4)})</div></div>
          <div class="tile"><div class="v">${held.length}</div><div class="k">instruments held · ${esc(a.release_state)}</div></div></div>
        <div class="grid2"><div>${table(held, [["Instrument", i => `${esc(i.name)} ${idChip(i.instrument_id, 14)}`], ["Role", i => esc(ROLE_LABEL[i.role] || i.role)], ["Weight", i => pct(i.weight, 2), false], ["Profile coverage", i => esc(i.coverage)]])}</div>
          <div>${table(Object.entries(a.weights_by_role || {}), [["Role", r => esc(ROLE_LABEL[r[0]] || r[0])], ["Weight", r => pct(r[1], 1), false]])}</div></div>
        <h3 class="chart-t">Weights by role and by instrument</h3><div id="allocWeights"></div>
        <h3 class="chart-t">Target and reached per state ${abasis ? basisChip(abasis) : ""}</h3><div id="allocCurve" class="chart" style="height:280px"></div>
        ${(a.coverage.warnings || []).map(w => `<p class="note warn">${esc(w)}</p>`).join("")}<p class="note">${esc(a.notice)} Curves in pcp's unit (annualised log return)${abasis ? `, ${esc(abasis)}` : ""}.</p>`;
      weightsChart($("allocWeights"), a.instruments, a.weights_by_role);   // chart 1 (C-34)
      stateCurveChart($("allocCurve"), a.curves.target, a.curves.achieved, abasis);   // chart 2, on the Allocation's own basis
      allocHost.parentElement.scrollIntoView({ behavior: "smooth" });
    } catch (e) { allocHost.innerHTML = `<p class="bad">pcp: ${esc(e.message)}</p>`; }
  }

  // ---- first draw: the current set, else the lbs proposal, else empty -------------------------
  await loadProposal();
  if (current) await fromMandate(current.body, `the current parameter set (finalised ${when(current.finalised_at).slice(0, 10)})`);
  else if (P.lbs) await fromMandate(fromProposal(P.proposal), "the lbs proposal", P.lbs.curve.points_pct ? { base: P.lbs.curve.points_pct, preset: null, label: "lbs proposal", shift: 0, tilt: 0 } : null);
  else { drawAll(F, ""); setCurve(null, null, ""); $("pStartInfo").innerHTML = "Pick a preset to start."; }
  loadRegime();
  const pre = mandates.find(m => m.key === S.params.get("preset"));   // #/curator/parameters?c=...&preset=balanced-chf
  if (pre) await applyPreset(pre);
  if (S.params.get("alloc")) await showAllocation(S.params.get("alloc"));
});

// ---- Approvals --------------------------------------------------------------------------
page("curator/approvals", "curator", "Approvals", async () => {
  head("Approvals", "What clients asked a curator to approve: reports, updates and AI-drafted answers. Nothing waits for a curator unless the client asked.");
  if (storeProblem()) return;
  const f = document.createElement("div"); f.className = "filters"; $("main").append(f);
  f.innerHTML = `<label>Show <select id="aState"><option value="awaiting_curator">awaiting a curator</option><option value="">all requests</option></select></label>`;
  $("aState").value = store.get("curator:astate") ?? "awaiting_curator";
  const host = card("", "", "Every event is terminal: an approved, revised or withdrawn request takes no further event.");
  const draw = async () => {
    store.set("curator:astate", $("aState").value);
    const rows = await api(`/curator/approvals?state=${encodeURIComponent($("aState").value)}`);
    host.innerHTML = approvalsHtml(rows, { withClient: true, empty: $("aState").value ? "Nothing awaits a curator." : "No approval requests." });
