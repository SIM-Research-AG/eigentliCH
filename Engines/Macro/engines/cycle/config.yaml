# Cycle model engine (cycle): configuration.
#
# Committed, so it never holds a password. Keep the local container's password in
# config.local.yaml (git-ignored) or set CYCLE_DB_PASSWORD. Precedence, lowest to highest:
#
#   this file  <  config.local.yaml  <  CYCLE_DATABASE_URL / DATABASE_URL  <  CYCLE_*
#
# Model parameters (the cycles, bands, anchors, widths, thresholds) are NOT here: they are
# versioned calibrations, seeded from src/cycle/calibration.py and extended through
# PUT /calibration.

service:
  host: 127.0.0.1
  port: 8012                    # Engine Building Guide section 4. Override with CYCLE_PORT.
  # "*" lets the test bench work when opened straight off disk. Narrow it before
  # deployment, e.g. CYCLE_CORS_ORIGINS=https://cockpit.example
  cors_origins: ["*"]

upstream:
  datafeed_url: http://127.0.0.1:8001
  timeout_s: 30
  # macrofield: the observed output paths the calibration's macrofield inputs read (1.1.0:
  # the pulse and business cycles). Override with CYCLE_MACROFIELD_URL.
  macrofield_url: http://127.0.0.1:8003
  macrofield_timeout_s: 60

database:
  host: 127.0.0.1
  port: 5432
  # One database for the whole system, one schema per engine, one role per engine
  # (Engine Building Guide section 8). The role owns this schema and holds SELECT and
  # nothing more on the shared `datafeed` schema.
  dbname: simtech
  schema: cycle
  user: cycle
  sslmode: prefer               # "require" or "verify-full" for anything over a network
  connect_timeout: 10
  maintenance_dbname: postgres  # only used by `python -m cycle init-db` to CREATE DATABASE

calibration:
  # The calibration a run uses when the request does not name one. Changing it is a
  # deliberate act; proposing a new calibration through PUT /calibration never is.
  active: "1.3.0"

run:
  # Economies when a request gives none, as datafeed country codes. Each economy's cycles
  # are its own (the anchored innovation cycle is the same for all), so the set changes
  # nothing but what is computed.
  economies: [BR, CH, CN, EU, IN, ID, MY, PH, TH, GB, US, JP, BD, VN, DE, ES]
  # Project the anchored cycles (innovation, credit, capital) as far ahead as macrofield
  # projects (2039 on today's state). Band-passed cycles stop at their data. A request can
  # override with "project": false.
  project: true

# Country names and valid codes come from datafeed (GET /countries): one registry for
# every engine.
