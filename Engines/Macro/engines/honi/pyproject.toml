[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "honi"
version = "1.1.0"
description = "Health of Nations Index engine. Model-derived research output; not investment advice."
requires-python = ">=3.11"
# Runtime. Every entry is on the Engine Building Guide allowlist (section 3) except
# psycopg, admitted by decision D-05. GET /meta reports this check live.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "numpy>=2.0,<3",
    "PyYAML>=6.0,<7",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
# Building and testing only; never in the deploy folder.
dev = [
    "pytest==8.3.4",
    "hypothesis>=6.100",
    "scipy>=1.11",       # golden/build_golden.py reads M_TS.mat
    "openpyxl==3.1.5",   # golden/build_golden.py reads HoNI_Export.xlsx and the ticker sheets
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
honi = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
