[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "macrofield"
version = "0.6.0"
description = "Engine 03, Macro Field: the three-body capital-saturation model. Model-derived research output; not investment advice."
requires-python = ">=3.11"
# Runtime. Every entry is on the Engine Building Guide allowlist (section 3) except psycopg,
# admitted by decision D-05 (honi). GET /meta reports this check live.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "numpy>=2.0,<3",
    "scipy>=1.11",
    "PyYAML>=6.0,<7",
    "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
# Loading a snapshot: the Penn World Table is published as xlsx. Needed by `python -m macrofield
# load` only, never by a running engine, and dropped once the Data Feed engine supplies PWT.
etl = ["openpyxl==3.1.5"]
# Building and testing only; never in the deploy folder.
dev = [
    "openpyxl==3.1.5",
    "pytest==8.3.4",
    "hypothesis>=6.100",
    "httpx==0.28.1",     # FastAPI TestClient, dev/freeze_sources.py
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macrofield = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: runs full calibrations (tens of seconds per economy)"]
