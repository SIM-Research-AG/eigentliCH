<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fund Map Test Bench</title>
<!--
  A development surface for examining the Fund Map engine in detail before anything is
  wired together. It is NOT the App and NOT part of the system: it talks to the same
  /v1 endpoints the App will, and nothing in engines/ or contracts/ knows it exists.

  No libraries. Charts are inline SVG built from the JSON the API returns, which is also
  the point of the exercise -- the API hands out series and facts, never rendered pictures.
-->
<style>
  :root {
    color-scheme: light;
    --surface-1:   #fcfcfb;
    --plane:       #f9f9f7;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-muted:   #898781;
    --grid:        #e1e0d9;
    --axis:        #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    /* Categorical slots 1-4, in fixed order. Gain, Income, Stabilisation, Protection. */
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    /* Ordinal support ramp, light: measured -> seed, five validated steps. */
    --sup-5: #0d366b;  /* measured    */
    --sup-4: #184f95;  /* interpolated */
    --sup-3: #256abf;  /* extrapolated */
    --sup-2: #3987e5;  /* borrowed     */
    --sup-1: #86b6ef;  /* seed         */
    --good:  #0ca30c;
    --critical: #d03b3b;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --plane:     #0d0d0d;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --ink-muted: #898781;
      --grid:      #2c2c2a;
      --axis:      #383835;
      --border:    rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --sup-5: #cde2fb; --sup-4: #9ec5f4; --sup-3: #5598e7; --sup-2: #2a78d6; --sup-1: #184f95;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --plane: #0d0d0d; --ink: #ffffff; --ink-2: #c3c2b7;
    --ink-muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --sup-5: #cde2fb; --sup-4: #9ec5f4; --sup-3: #5598e7; --sup-2: #2a78d6; --sup-1: #184f95;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--plane); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  header {
    padding: 20px 16px 0; max-width: 1180px; margin: 0 auto;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .spacer { flex: 1 1 auto; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }

  button, select {
    font: inherit; color: var(--ink); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover, select:hover { background: var(--plane); }
  button[aria-pressed="true"] { background: var(--ink); color: var(--surface-1); border-color: var(--ink); }

  nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 4px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 650; }
  .card .q { color: var(--ink-2); font-size: 13px; margin: 0 0 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .tile .k { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
  .tile .v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
  .tile .n { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
  .scroll { overflow-x: auto; }
  details { margin-top: 12px; } details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }

  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--border); }
  .pass { color: var(--good); } .fail { color: var(--critical); }
  .err { color: var(--critical); }
  svg { display: block; max-width: 100%; }
  svg text { fill: var(--ink-muted); font-size: 11px; }
  .tip {
    position: fixed; pointer-events: none; z-index: 20; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.13); opacity: 0; transition: opacity .09s; max-width: 260px;
  }
  .tip.on { opacity: 1; }
  .tip b { font-weight: 600; }
  .hidden { display: none; }
  .note { font-size: 12.5px; color: var(--ink-muted); margin-top: 10px; }
  .apiwrap { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  .apiwrap input {
    font: inherit; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--ink); background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; width: 210px;
  }
  pre.cmd {
    background: var(--plane); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.6;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--ink);
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Fund Map · test bench</h1>
    <div class="sub" id="subtitle">loading…</div>
  </div>
  <div class="spacer"></div>
  <label id="apiwrap" class="apiwrap hidden">API
    <input id="api" type="url" spellcheck="false" placeholder="http://127.0.0.1:8006">
  </label>
  <button id="theme" title="Toggle light and dark">◐ theme</button>
</header>

<main>
  <nav id="tabs"></nav>
  <div id="panels"></div>
</main>

<div class="tip" id="tip"></div>

<script>
// Where the API lives.
//
// This file gets opened two ways and both have to work: served by the engine itself at
// http://127.0.0.1:8006/, and double-clicked straight off disk. On `file://` a relative
// fetch("/v1/health") resolves to file:///v1/health and dies with a bare "Failed to
// fetch", so an absolute base is required there. Override with ?api=http://host:port or
// the field in the header; the choice is remembered.
const DEFAULT_API = "http://127.0.0.1:8006";
const STANDALONE = location.protocol === "file:";
function resolveApi() {
  const q = new URLSearchParams(location.search).get("api");
  if (q) return q.replace(/\/+$/, "");
  try {
    const saved = (localStorage.getItem("fundmap.api") || "").replace(/\/+$/, "");
    // 8000 was this engine's port until it moved to 8006 (Engine 06); it is now the
    // cockpit's, so a base remembered from before the move is dropped, not followed.
    if (saved && saved !== "http://127.0.0.1:8000") return saved;
  } catch { /* private mode or blocked storage - fall through to the default */ }
  return STANDALONE ? DEFAULT_API : "";
}
let API = resolveApi();
const $ = (s, r=document) => r.querySelector(s);
const el = (t, a={}, kids=[]) => {
  const n = document.createElement(t);
  for (const [k,v] of Object.entries(a)) {
    if (k === "class") n.className = v; else if (k === "html") n.innerHTML = v; else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) n.append(c);
  return n;
};
const svgEl = (t, a={}) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", t);
  for (const [k,v] of Object.entries(a)) n.setAttribute(k, v);
  return n;
};
// ---- display rounding: begin (review/ROUNDING.md; cockpit C-37) ----
// Canonical copy: Engines/cockpit/dev/display_rounding.js. The cockpit page and every engine's test bench carry this
// block verbatim between the begin and end lines; tests/test_api.py checks that every copy is identical. Change it
// here, then copy it into each page. Display only: the figures stay exact everywhere else (contracts, artefacts,
// stores, raw JSON views); a number is rounded only where it becomes text or a chart label.
// Use: const N = displayRounding({ lang: "en", group: "’", na: "–" }); then N.money(38250) is "CHF 38’300".
function displayRounding(opts) {
  const o = Object.assign({ lang: "en", group: "’", na: "–", minus: "−" }, opts || {});
  const WORDS = { en: { m: "m", below: "below", above: "above" }, de: { m: "Mio.", below: "unter", above: "über" } };
  const w = () => WORDS[o.lang] || WORDS.en;
  const ok = v => v !== null && v !== undefined && v !== "" && typeof v !== "boolean" && Number.isFinite(Number(v));
  const grouped = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, o.group);
  // d decimals, the integer part grouped, a true minus sign, never "-0"; sign: "+" before a positive figure
  function fixed(v, d, sign) {
    const x = Number(v), t = Math.abs(x).toFixed(d || 0), parts = t.split(".");
    const body = grouped(parts[0]) + (parts[1] ? "." + parts[1] : "");
    return (Number(t) === 0 ? "" : x < 0 ? o.minus : sign ? "+" : "") + body;
  }
  const stepped = (x, step) => Math.sign(x) * Math.round(Math.abs(x) / step) * step;
  // CHF, EUR, USD: below 1 000 whole units; to 99 999 the nearest 100; to 999 999 the nearest 1 000; then millions, two decimals
  function amountText(v) {
    const x = Number(v), a = Math.abs(x);
    if (a < 999.5) return fixed(x, 0);
    if (a < 99950) return fixed(stepped(x, 100), 0);
    if (a < 999500) return fixed(stepped(x, 1000), 0);
    return fixed(x / 1e6, 2) + " " + w().m;
  }
  const pre = (cur, text) => cur ? cur + " " + text : text;
  const N = {
    opts: o,
    ok,
    fixed: (v, d, sign) => ok(v) ? fixed(v, d, sign) : o.na,
    // an amount by the stepped rule, with its currency in front ("" for none)
    money: (v, cur = "CHF") => ok(v) ? pre(cur, amountText(v)) : o.na,
    amount: v => ok(v) ? amountText(v) : o.na,
    // a figure the client stated (a fee, a deposit, a price): shown as stated, whole units unless it has cents
    stated: (v, cur = "CHF") => ok(v) ? pre(cur, fixed(v, Number.isInteger(Number(v)) ? 0 : 2)) : o.na,
    // returns, rates, inflation: one decimal, percent; rate takes a fraction (0.049), ratePct a percent (4.9)
    rate: (v, sign) => ok(v) ? fixed(Number(v) * 100, 1, sign) + " %" : o.na,
    ratePct: (v, sign) => ok(v) ? fixed(v, 1, sign) + " %" : o.na,
    // percentage points (a shift between two rates given in percent)
    pp: (v, sign = true) => ok(v) ? fixed(v, 1, sign) + " pp" : o.na,
    // chances: whole percent; below 1 % and above 99 % in words; 0 % and 100 % only when every path agrees (exactly 0 or 1)
    chance: v => {
      if (!ok(v)) return o.na;
      const p = Number(v);
      if (p <= 0) return "0 %";
      if (p >= 1) return "100 %";
      if (p < 0.01) return w().below + " 1 %";
      if (p > 0.99) return w().above + " 99 %";
      return Math.round(p * 100) + " %";
    },
    // portfolio weights and shares: whole percent; below 1 % one decimal; 0 is "–"; weight takes a fraction, weightPct a percent
    weightPct: v => {
      if (!ok(v)) return o.na;
      const p = Number(v), a = Math.abs(p);
      if (a === 0) return "–";
      if (a < 0.05) return w().below + " 0.1 %";
      return fixed(p, a < 0.95 ? 1 : 0) + " %";
    },
    weight: v => ok(v) ? N.weightPct(Number(v) * 100) : o.na,
    // model levels without a unit (scores, expertise, network, health): the word first when there is one, two decimals
    level: (v, word) => ok(v) ? (word ? word + " (" + fixed(v, 2) + ")" : fixed(v, 2)) : o.na,
    // ratios and durations one decimal; betas two
    ratio: v => ok(v) ? fixed(v, 1) : o.na,
    beta: v => ok(v) ? fixed(v, 2) : o.na,
    // a change with its sign, d decimals (a score change 2, a z-score 1)
    signed: (v, d = 2) => ok(v) ? fixed(v, d, true) : o.na,
    // years, ages, hours, seconds: whole, never grouped (2034); counts: whole, grouped (12’000)
    whole: v => ok(v) ? fixed(Math.round(Number(v)), 0).split(o.group).join("") : o.na,
    count: v => ok(v) ? fixed(Math.round(Number(v)), 0) : o.na,
    // a figure of no stated kind (raw index values, a model card's series): three significant digits, whole from 100
    auto: v => {
      if (!ok(v)) return o.na;
      const x = Number(v), a = Math.abs(x);
      if (a === 0) return "0";
      if (a >= 999500) return fixed(x / 1e6, 2) + " " + w().m;
      if (a >= 99.5) return fixed(x, 0);
      const d = Math.min(8, Math.max(0, 2 - Math.floor(Math.log10(a))));
      return fixed(x, d).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
    },
    // chart axis: about n round ticks covering lo to hi, one step past each end (the chart hides the ticks outside its
    // range), each labelled by fn (N.money, N.rate, ...): spread the result into the chart's axis
    ticks: (lo, hi, fn, n = 5) => {
      lo = Number(lo) || 0; hi = Number(hi) || 0;
      if (hi < lo) { const t = lo; lo = hi; hi = t; }
      const raw = ((hi - lo) || Math.abs(hi) || 1) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= raw * 0.999);
      const vals = [];
      for (let k = Math.floor(lo / step + 1e-9); k * step < hi + step * (1 - 1e-9); k++) vals.push(Math.round(k * step * 1e9) / 1e9);
      return { tickmode: "array", tickvals: vals, ticktext: vals.map(v => fn(v)) };
    },
  };
  return N;
}
// ---- display rounding: end ----
const N = displayRounding({ na: "—" });

// The five support levels, weakest to strongest. `data-driven` and `data-driven-trimmed`
// share a colour step: they are the same kind of support and differ only in sample size,
// which the label and the tooltip still report.
const SUPPORT = {
  "seed":                 {rank:1, css:"--sup-1", label:"seed"},
  "borrowed":             {rank:2, css:"--sup-2", label:"borrowed"},
  // D2, and a phase the 12 month forward measurement had to fill. Shares borrowed's
  // step: the shape was not measured on this instrument either way.
  "shape-scaled":         {rank:2, css:"--sup-2", label:"shape-scaled"},
  // The default since 29.09.2026 (FMRE-22): the instrument's own 12 month forward
  // measurement, lightly smoothed across neighbouring states.
  "forward-12m-smoothed": {rank:3, css:"--sup-3", label:"forward 12m, smoothed"},
  "extrapolated":         {rank:3, css:"--sup-3", label:"extrapolated"},
  "interpolated":         {rank:4, css:"--sup-4", label:"interpolated"},
  "data-driven":          {rank:5, css:"--sup-5", label:"measured"},
  "data-driven-trimmed":  {rank:5, css:"--sup-5", label:"measured (trimmed)"},
};
const ROLE_SLOT = {gain:1, income:2, stabilisation:3, protection:4};
const roleColor = r => `var(--series-${ROLE_SLOT[r] || 1})`;

const tip = $("#tip");
function showTip(ev, html) {
  tip.innerHTML = html; tip.classList.add("on");
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => tip.classList.remove("on");

// Thrown when the API could not be reached at all, as opposed to answering with an error.
// The two need different advice: one means "start the server", the other means "the
// server is up but something is wrong with the request or the store".
class Unreachable extends Error {}

async function get(path) {
  let r;
  try {
    r = await fetch(API + path);
  } catch (e) {
    throw new Unreachable(e.message);
  }
  if (!r.ok) throw new Error(`${path} → ${r.status} ${(await r.text()).slice(0,200)}`);
  return r.json();
}

/* ------------------------------------------------------------------ charts */

// Multi-series line over the 25-state axis. Crosshair + shared tooltip, direct labels.
function lineChart(series, opts={}) {
  const W = opts.width || 860, H = opts.height || 300;
  const M = {t: 14, r: 128, b: 32, l: 54};
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const n = series[0].values.length;
  const all = series.flatMap(s => s.values);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.12 || 0.01; lo -= pad; hi += pad;
  const x = i => M.l + (n === 1 ? iw/2 : (i * iw) / (n - 1));
  const y = v => M.t + ih - ((v - lo) / (hi - lo)) * ih;

  const svg = svgEl("svg", {viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img"});

  // Recessive grid + zero line.
  const ticks = 5;
  for (let i = 0; i <= ticks; i++) {
    const v = lo + (hi - lo) * i / ticks;
    svg.append(svgEl("line", {x1:M.l, x2:M.l+iw, y1:y(v), y2:y(v), stroke:"var(--grid)", "stroke-width":1}));
    const t = svgEl("text", {x: M.l - 8, y: y(v) + 4, "text-anchor": "end"});
    t.textContent = N.rate(v); svg.append(t);
  }
  if (lo < 0 && hi > 0) svg.append(svgEl("line", {x1:M.l, x2:M.l+iw, y1:y(0), y2:y(0), stroke:"var(--axis)", "stroke-width":1}));

  for (let i = 0; i < n; i += 4) {
    const t = svgEl("text", {x: x(i), y: H - 10, "text-anchor": "middle"});
    t.textContent = i + 1; svg.append(t);
  }
  const xl = svgEl("text", {x: M.l + iw/2, y: H - 10, "text-anchor":"middle", "font-size":11});
  xl.textContent = ""; svg.append(xl);

  series.forEach(s => {
    const d = s.values.map((v,i) => `${i?"L":"M"}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(" ");
    svg.append(svgEl("path", {d, fill:"none", stroke:s.color, "stroke-width":2,
                              "stroke-linejoin":"round", "stroke-linecap":"round"}));
    // Direct label at the right end -- identity never rests on colour alone.
    const t = svgEl("text", {x: M.l + iw + 10, y: y(s.values[n-1]) + 4, "text-anchor":"start",
                             "font-size":12, "font-weight":600});
    t.setAttribute("fill", "var(--ink-2)");
    t.textContent = s.label; svg.append(t);
  });

  // Mark the five measured knots on every series: states 3, 8, 13, 18, 23.
  series.forEach(s => (opts.knots || []).forEach(k => {
    svg.append(svgEl("circle", {cx:x(k), cy:y(s.values[k]), r:4, fill:s.color,
                                stroke:"var(--surface-1)", "stroke-width":2}));
  }));

  const cross = svgEl("line", {y1:M.t, y2:M.t+ih, stroke:"var(--axis)", "stroke-width":1, opacity:0});
  svg.append(cross);
  const hit = svgEl("rect", {x:M.l, y:M.t, width:iw, height:ih, fill:"transparent"});
  svg.append(hit);
  hit.addEventListener("mousemove", ev => {
    const bb = svg.getBoundingClientRect();
    const rel = (ev.clientX - bb.left) * (W / bb.width);
    const i = Math.max(0, Math.min(n-1, Math.round((rel - M.l) / (iw / (n-1)))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", 1);
    const rows = series.map(s => {
      const m = s.methods ? ` <span style="color:var(--ink-muted)">${SUPPORT[s.methods[i]]?.label ?? s.methods[i]}</span>` : "";
      return `<div><span class="swatch" style="background:${s.color}"></span> ${s.label} <b>${N.rate(s.values[i])}</b>${m}</div>`;
    }).join("");
    showTip(ev, `<b>State ${i+1}</b>${rows}`);
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
  return svg;
}

// Coverage matrix: one row per profile, one cell per state, coloured by support level.
function coverageMatrix(rows) {
  const cell = 26, gap = 2, labelW = 190;
  const W = labelW + 25 * cell, H = rows.length * cell + 24;
  const svg = svgEl("svg", {viewBox:`0 0 ${W} ${H}`, width:W, height:H, role:"img"});
  for (let s = 0; s < 25; s += 4) {
    const t = svgEl("text", {x: labelW + s*cell + cell/2, y: 12, "text-anchor":"middle"});
    t.textContent = s + 1; svg.append(t);
  }
  rows.forEach((row, r) => {
    const yy = 24 + r * cell;
    const t = svgEl("text", {x: labelW - 10, y: yy + cell/2 + 4, "text-anchor":"end", "font-size":12});
    t.setAttribute("fill", "var(--ink-2)"); t.textContent = row.label; svg.append(t);
    row.methods.forEach((m, s) => {
      const sup = SUPPORT[m] || {css:"--sup-1", label:m};
      const rect = svgEl("rect", {
        x: labelW + s*cell, y: yy, width: cell - gap, height: cell - gap,
        rx: 3, fill: `var(${sup.css})`
      });
      rect.addEventListener("mousemove", ev => showTip(ev,
        `<b>${row.label}</b><br>State ${s+1} · ${sup.label}` +
        (row.n_obs ? `<br>n = ${N.count(row.n_obs[s])}` : "") +
        (row.values ? `<br>${N.rate(row.values[s])}` : "")));
      rect.addEventListener("mouseleave", hideTip);
      svg.append(rect);
    });
  });
  return svg;
}

// Small-multiple bars: one panel per block, five phase bars each.
function phasePanels(blocks, phaseNames) {
  const wrap = el("div", {class:"scroll"});
  const grid = el("div");
  grid.style.display = "grid";
  grid.style.gridTemplateColumns = "repeat(auto-fit, minmax(230px, 1fr))";
  grid.style.gap = "10px";
  const all = blocks.flatMap(b => b.means);
  const lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  blocks.forEach(b => {
    const W = 230, H = 132, M = {t:22, r:8, b:26, l:34};
    const iw = W - M.l - M.r, ih = H - M.t - M.b;
    const y = v => M.t + ih - ((v - lo) / (hi - lo)) * ih;
    const bw = iw / 5;
    const svg = svgEl("svg", {viewBox:`0 0 ${W} ${H}`, width:W, height:H});
    const title = svgEl("text", {x:M.l, y:12, "font-size":12, "font-weight":600});
    title.setAttribute("fill", "var(--ink)"); title.textContent = b.label; svg.append(title);
    svg.append(svgEl("line", {x1:M.l, x2:M.l+iw, y1:y(0), y2:y(0), stroke:"var(--axis)", "stroke-width":1}));
    [lo, hi].forEach(v => {
      const t = svgEl("text", {x:M.l-6, y:y(v)+4, "text-anchor":"end", "font-size":10});
      t.textContent = N.rate(v); svg.append(t);
    });
    b.means.forEach((v, i) => {
      const top = Math.min(y(v), y(0)), h = Math.abs(y(v) - y(0));
      const rect = svgEl("rect", {
        x: M.l + i*bw + 2, y: top, width: bw - 4, height: Math.max(h, 1),
        rx: 3, fill: v < 0 ? "var(--series-2)" : "var(--series-1)"
      });
      rect.addEventListener("mousemove", ev => showTip(ev,
        `<b>${b.label}</b><br>${phaseNames[i]} · <b>${N.rate(v)}</b><br>n = ${N.count(b.n_obs[i])}`));
      rect.addEventListener("mouseleave", hideTip);
      svg.append(rect);
      const t = svgEl("text", {x: M.l + i*bw + bw/2, y: H - 10, "text-anchor":"middle", "font-size":9.5});
      t.textContent = phaseNames[i].slice(0,4); svg.append(t);
    });
    grid.append(svg);
  });
  wrap.append(grid);
  return wrap;
}

// The 150-year cycle, with the phase bands behind it.
function cycleChart(years) {
  const W = 1100, H = 260, M = {t:14, r:16, b:28, l:46};
  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  const vals = years.map(d => d.cycle);
  const lo = Math.min(...vals) - 0.2, hi = Math.max(...vals) + 0.2;
  const x = i => M.l + (i * iw) / (years.length - 1);
  const y = v => M.t + ih - ((v - lo) / (hi - lo)) * ih;
  const svg = svgEl("svg", {viewBox:`0 0 ${W} ${H}`, width:W, height:H, role:"img"});
  [[1.65,"boom"],[1.0,"expansion"],[0.2,"stagnation"],[-0.2,""],[-1.0,"contraction"],[-1.65,"crisis"]]
    .forEach(([v, name]) => {
      if (v < lo || v > hi) return;
      svg.append(svgEl("line", {x1:M.l, x2:M.l+iw, y1:y(v), y2:y(v),
        stroke:"var(--grid)", "stroke-width":1, "stroke-dasharray": name ? "" : "3 3"}));
      if (name) { const t = svgEl("text", {x:M.l+iw-4, y:y(v)-4, "text-anchor":"end", "font-size":10});
                  t.textContent = name; svg.append(t); }
    });
  [-2,-1,0,1,2].forEach(v => {
    if (v < lo || v > hi) return;
    const t = svgEl("text", {x:M.l-8, y:y(v)+4, "text-anchor":"end"});
    t.textContent = N.whole(v) + "σ"; svg.append(t);
  });
  const d = years.map((p,i) => `${i?"L":"M"}${x(i).toFixed(2)},${y(p.cycle).toFixed(2)}`).join(" ");
  svg.append(svgEl("path", {d, fill:"none", stroke:"var(--series-1)", "stroke-width":2, "stroke-linejoin":"round"}));
  years.forEach((p,i) => {
    if (p.phase !== "crisis") return;
    svg.append(svgEl("circle", {cx:x(i), cy:y(p.cycle), r:3, fill:"var(--series-2)",
                                stroke:"var(--surface-1)", "stroke-width":2}));
  });
  for (let i = 0; i < years.length; i += 20) {
    const t = svgEl("text", {x:x(i), y:H-8, "text-anchor":"middle"});
    t.textContent = years[i].year; svg.append(t);
  }
  const hit = svgEl("rect", {x:M.l, y:M.t, width:iw, height:ih, fill:"transparent"});
  svg.append(hit);
  hit.addEventListener("mousemove", ev => {
    const bb = svg.getBoundingClientRect();
    const rel = (ev.clientX - bb.left) * (W / bb.width);
    const i = Math.max(0, Math.min(years.length-1, Math.round((rel - M.l) / (iw/(years.length-1)))));
    showTip(ev, `<b>${years[i].year}</b><br>${years[i].phase}<br>${N.signed(years[i].cycle, 2)} σ`);
  });
  hit.addEventListener("mouseleave", hideTip);
  return svg;
}

// A plain time-series line, for a performance curve or a raw annual series.
function timeChart(points, opts={}) {
  const W = opts.width || 900, H = opts.height || 220, M = {t:12, r:16, b:28, l:58};
  const iw = W-M.l-M.r, ih = H-M.t-M.b;
  const vals = points.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (opts.zero) lo = Math.min(lo, 0);
  const pad = (hi-lo)*0.08 || Math.abs(hi||1)*0.1; lo -= pad; hi += pad;
  const x = i => M.l + (points.length<2 ? iw/2 : i*iw/(points.length-1));
  const y = v => M.t + ih - ((v-lo)/(hi-lo))*ih;
  const svg = svgEl("svg", {viewBox:`0 0 ${W} ${H}`, width:W, height:H, role:"img"});
  for (let i=0;i<=4;i++) {
    const v = lo + (hi-lo)*i/4;
    svg.append(svgEl("line",{x1:M.l,x2:M.l+iw,y1:y(v),y2:y(v),stroke:"var(--grid)","stroke-width":1}));
    const t = svgEl("text",{x:M.l-8,y:y(v)+4,"text-anchor":"end"});
    t.textContent = (opts.fmt || N.auto)(v); svg.append(t);
  }
  if (lo < 0 && hi > 0)
    svg.append(svgEl("line",{x1:M.l,x2:M.l+iw,y1:y(0),y2:y(0),stroke:"var(--axis)","stroke-width":1}));
  const d = points.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(2)},${y(p.v).toFixed(2)}`).join(" ");
  svg.append(svgEl("path",{d,fill:"none",stroke:opts.color||"var(--series-1)","stroke-width":2,"stroke-linejoin":"round"}));
  const step = Math.max(1, Math.round(points.length/8));
  for (let i=0;i<points.length;i+=step) {
    const t = svgEl("text",{x:x(i),y:H-9,"text-anchor":"middle"});
    t.textContent = points[i].k; svg.append(t);
  }
  const hit = svgEl("rect",{x:M.l,y:M.t,width:iw,height:ih,fill:"transparent"}); svg.append(hit);
  hit.addEventListener("mousemove", ev => {
    const bb = svg.getBoundingClientRect();
    const rel = (ev.clientX-bb.left)*(W/bb.width);
    const i = Math.max(0, Math.min(points.length-1, Math.round((rel-M.l)/(iw/(points.length-1)))));
    showTip(ev, `<b>${points[i].k}</b><br>${(opts.fmt || N.auto)(points[i].v)}`);
  });
  hit.addEventListener("mouseleave", hideTip);
  return svg;
}

  const c1 = el("div", {class:"card"});
  c1.append(el("h2", {}, "The transformation, step by step"));
  c1.append(el("p", {class:"q"}, `Nine steps take ${N.count(method.window.observations)} annual observations to a 25-state profile. Five of those twenty-five carry a measured number; the rest are filled and labelled.`));
  method.steps.forEach(s => {
    const d = el("details");
    d.append(el("summary",{},`${s.step}. ${s.name}  ·  ${s.frequency}`));
    d.append(el("p",{class:"q",style:"margin-top:8px"}, s.what));
    d.append(el("pre",{class:"cmd"}, s.formulas.join("\n")));
    d.append(el("p",{class:"note"}, s.why));
    c1.append(d);
  });
  host.append(c1);

  const c2 = el("div", {class:"card"});
  c2.append(el("h2", {}, "The market environment, 1871–2020"));
  const env = await get("/v1/market-environment");
  c2.append(el("p", {class:"q"}, "The standardised economic cycle. Orange marks the years classified as crisis."));
  c2.append(el("div",{class:"scroll"},[cycleChart(env.years)]));
  host.append(c2);

  const c3 = el("div", {class:"card"});
  c3.append(el("h2", {}, "Trace one year"));
  c3.append(el("p", {class:"q"}, "Eight indicators, de-trended and signed so higher means better, averaged and standardised into one reading in sigma — which picks the phase."));
  const yearSel = el("select");
  for (let y = method.window.last_year; y >= method.window.first_year; y--)
    yearSel.append(el("option",{value:String(y)}, String(y)));
  yearSel.value = "2008";
  c3.append(el("div",{class:"row"},[yearSel]));
  const yearOut = el("div"); c3.append(yearOut); host.append(c3);

  async function drawYear() {
    yearOut.replaceChildren(el("p",{class:"q"},"loading…"));
    const d = await get(`/v1/data/indicators?year=${yearSel.value}`);
    const t = el("table");
    t.append(el("thead",{},[el("tr",{},["indicator","de-trend","sign","residual","standardised"].map(h=>el("th",{},h)))]));
    const b = el("tbody");
    d.indicators.forEach(i => b.append(el("tr",{},[el("td",{},i.name), el("td",{},i.detrend),
      el("td",{}, i.sign>0?"+":"−"), el("td",{},N.auto(i.residual)), el("td",{},N.signed(i.standardised, 2))])));
    b.append(el("tr",{},[el("td",{},el("b",{},"mean of the eight")),el("td",{},""),el("td",{},""),
      el("td",{},""), el("td",{},el("b",{},N.signed(d.mean_of_standardised, 2)))]));
    t.append(b);
    yearOut.replaceChildren(el("div",{class:"scroll"},[t]),
      el("p",{class:"note"}, d.cycle_note),
      el("pre",{class:"cmd"},
        `ec_cycle(${d.year}) = ${N.signed(d.cycle, 2)} sigma\n${d.classification}\ninflation that year = ${N.rate(d.inflation)}`));
  }
  yearSel.addEventListener("change", drawYear);

  const c4 = el("div", {class:"card"});
  c4.append(el("h2", {}, "The quantile bridge"));
  const m = await get("/v1/state-map");
  c4.append(el("p", {class:"q"}, m.note));
  const W=860,H=280,MG={t:14,r:16,b:34,l:46}, iw=W-MG.l-MG.r, ih=H-MG.t-MG.b;
  const xx = s => MG.l + ((s-1)*iw)/24, yy = s => MG.t + ih - ((s-1)*ih)/24;
  const svg = svgEl("svg",{viewBox:`0 0 ${W} ${H}`,width:W,height:H,role:"img"});
  for (let s=1;s<=25;s+=4) {
    svg.append(svgEl("line",{x1:xx(s),x2:xx(s),y1:MG.t,y2:MG.t+ih,stroke:"var(--grid)","stroke-width":1}));
    const t=svgEl("text",{x:xx(s),y:H-14,"text-anchor":"middle"}); t.textContent=s; svg.append(t);
    const u=svgEl("text",{x:MG.l-8,y:yy(s)+4,"text-anchor":"end"}); u.textContent=s; svg.append(u);
  }
  svg.append(svgEl("path",{d:`M${xx(1)},${yy(1)}L${xx(25)},${yy(25)}`,stroke:"var(--axis)",
    "stroke-width":1,"stroke-dasharray":"4 4",fill:"none"}));
  svg.append(svgEl("path",{d:m.entries.map((e,i)=>`${i?"L":"M"}${xx(e.signal_state)},${yy(e.calib_state)}`).join(" "),
    fill:"none",stroke:"var(--series-1)","stroke-width":2,"stroke-linejoin":"round"}));
  m.entries.forEach(e => {
    const dot = svgEl("circle",{cx:xx(e.signal_state),cy:yy(e.calib_state),r:4.5,
      fill:"var(--series-1)",stroke:"var(--surface-1)","stroke-width":2});
    dot.addEventListener("mousemove", ev => showTip(ev,
      `<b>Signal column ${e.signal_state}</b><br>centile ${N.ratePct(e.centile)}<br>cycle ${N.signed(e.cycle_value, 2)} σ<br>axis ${N.level(e.axis_value)} → state ${e.calib_state}`));
    dot.addEventListener("mouseleave", hideTip); svg.append(dot);
  });
  c4.append(el("div",{class:"legend"},[
    el("span",{html:`<span class="swatch" style="background:var(--series-1)"></span>quantile bridge`}),
    el("span",{html:`<span class="swatch" style="background:var(--axis)"></span>identity (column n = state n)`})]));
  c4.append(el("div",{class:"scroll"},[svg]));
  c4.append(el("p",{class:"note"}, m.coverage_warning + ` Unreachable: ${m.unreachable_states.join(", ")}.`));
  host.append(c4);

  const c5 = el("div", {class:"card"});
  c5.append(el("h2", {}, "Trace one month"));
  const periodIn = el("input",{type:"text",placeholder:"YYYY-MM",style:"width:120px"});
  const periodBtn = el("button",{},"trace");
  c5.append(el("div",{class:"row"},[periodIn,periodBtn]));
  const monthOut = el("div"); c5.append(monthOut); host.append(c5);

  async function drawMonth() {
    monthOut.replaceChildren(el("p",{class:"q"},"loading…"));
    const q = periodIn.value.trim();
    try {
      const d = await get("/v1/data/bridge" + (q?`?period=${encodeURIComponent(q)}`:""));
      periodIn.value = d.period;
      const g = d.bridge;
      monthOut.replaceChildren(
        el("p",{class:"note"}, d.normalisation + (d.in_tolerance?"":"  This month is one of the five flagged as out of tolerance.")),
        el("pre",{class:"cmd"},
          `period               ${d.period}\n` +
          `modal signal column  ${d.modal_state}      (mean column ${N.ratio(d.mean_state)})\n` +
          `  its centile        ${N.ratePct(g.centile)}\n` +
          `  ec_cycle there     ${N.signed(g.cycle_value, 2)} sigma\n` +
          `  phase axis         ${N.level(g.axis_value)}   on the 1..5 scale\n` +
          `  calibration state  ${g.calibration_state}`),
        el("p",{class:"note"}, d.note));
    } catch(e) { monthOut.replaceChildren(el("p",{class:"err"}, e.message)); }
  }
  periodBtn.addEventListener("click", drawMonth);
  periodIn.addEventListener("keydown", ev => { if (ev.key==="Enter") drawMonth(); });

  await Promise.all([drawYear(), drawMonth()]);
});

/* ==================== LEVEL 3 — INSTRUMENT PERFORMANCE ===================== */

  t2.append(el("thead",{},[el("tr",{},["instrument","role","asset class","ccy","ticker","liquidity"].map(h=>el("th",{},h)))]));

  none.forEach(i => b2.append(el("tr",{},[el("td",{},i.name), el("td",{},i.role),

    const one = (await get(`/v1/data/performance?instrument_id=${sel.value}`)).instruments[0];

    bt.append(el("thead",{},[el("tr",{},["state","n","estimate","std err","95% interval"].map(h=>el("th",{},h)))]));
    const bb = el("tbody");
    tr.buckets.forEach(x => bb.append(el("tr",{},[el("td",{},String(x.state)), el("td",{},N.count(x.n_obs)),
      el("td",{},N.rate(x.estimate)), el("td",{},N.rate(x.std_error)),

/* ===================== REVIEWS R-002 / R-003 — ESTIMATOR TOGGLE ===================== */

// Four estimators, one instrument, one currency. The default (the 12 month forward
// measurement, lightly smoothed, FMRE-22) is what the ReturnSet publishes; the cascade in
// source currency is the stored profile; everything is computed on request by
// /v1/diagnostics/estimators and never stored.
const METHODS = [
  {id:"forward_12m_smoothed", label:"12m forward, smoothed (default)", color:"var(--series-4)"},
  {id:"forward_12m",  label:"12m forward, unsmoothed", color:"var(--series-3)"},
  {id:"shape_scaled", label:"D2 shape-scaled",   color:"var(--series-1)"},
  {id:"cascade",      label:"cascade (stored)",  color:"var(--series-2)"},
];
const CCY_LABEL = c => c || "source currency";

tab("estimators", "Estimators · R-002/3", async host => {
  const state = {currency: "", method: "all", instrument: "INS-precious-metals"};
  try { Object.assign(state, JSON.parse(localStorage.getItem("fundmap.est") || "{}")); } catch { /* not essential */ }
  const save = () => { try { localStorage.setItem("fundmap.est", JSON.stringify(state)); } catch { /* not essential */ } };

  const controls = el("div", {class:"card"});
  controls.append(el("h2", {}, "Instrument estimators side by side"));
  controls.append(el("p", {class:"q"},
    "The published default (the 12 month forward measurement with a light smoothing across neighbouring states, FMRE-22), the unsmoothed measurement (D-02), D2 shape-scaled and the stored cascade, in the currency you choose (D-01)."));
  const ccy = el("select");
  [["", "source currency"], ["CHF","CHF"], ["EUR","EUR"], ["USD","USD"]].forEach(([v,l]) =>
    ccy.append(el("option", {value:v}, l)));
  ccy.value = state.currency;
  const toggle = el("div", {class:"row", style:"margin:0"});
  const methodButtons = [{id:"all", label:"all four"}].concat(METHODS).map(m => {
    const b = el("button", {"aria-pressed": String(state.method === m.id)}, m.label);
    b.addEventListener("click", () => { state.method = m.id; save();
      methodButtons.forEach(x => x.setAttribute("aria-pressed", String(x === b))); drawOne(); });
    toggle.append(b); return b;
  });
  const sel = el("select");
  controls.append(el("div", {class:"row"}, [el("span", {class:"sub"}, "currency"), ccy,
    el("span", {class:"sub"}, "instrument"), sel]));
  controls.append(toggle);
  host.append(controls);

  const summaryCard = el("div", {class:"card"});
  const chartCard = el("div", {class:"card"});
  const detailCard = el("div", {class:"card"});
  host.append(summaryCard, chartCard, detailCard);

  let data = null;

  async function load() {
    summaryCard.replaceChildren(el("p", {class:"q"}, "loading…"));
    const q = state.currency ? `?currency=${state.currency}` : "";
    try { data = await get(`/v1/diagnostics/estimators${q}`); }
    catch (e) { summaryCard.replaceChildren(problemCard(e)); chartCard.replaceChildren(); detailCard.replaceChildren(); return; }
    const prior = state.instrument;
    sel.replaceChildren();
    data.instruments.forEach(i => sel.append(el("option", {value:i.instrument_id},
      `${i.name} — ${i.role}`)));
    sel.value = data.instruments.some(i => i.instrument_id === prior) ? prior : data.instruments[0].instrument_id;
    drawSummary(); drawOne();
  }

  function drawSummary() {
    summaryCard.replaceChildren(el("h2", {}, `Across ${data.summary.cascade.instruments} instruments with history · ${CCY_LABEL(data.currency)}`));
    summaryCard.append(el("p", {class:"q"},
      "Mean and largest jump between neighbouring states, the largest move the smoother made to a phase value, protection instruments negative at the crisis knot (state 3), protection instruments failing their type's rule (FMRE-24: tail hedge paid in the crisis months; cash never negative; otherwise positive in every crisis state and highest in crisis in the source currency), and the share of states by method label."));
    const t = el("table");
    t.append(el("thead", {}, [el("tr", {}, ["estimator", "mean jump", "largest jump", "max phase move", "protection negative in crisis", "protection failing its rule", "states by label"].map(h => el("th", {}, h)))]));
    const b = el("tbody");
    METHODS.forEach(m => {
      const s = data.summary[m.id];
      const labels = Object.entries(s.state_share_by_label).map(([k,v]) => `${k} ${N.weight(v)}`).join(" · ");
      b.append(el("tr", {}, [
        el("td", {html:`<span class="swatch" style="background:${m.color}"></span> ${m.label}`}),
        el("td", {}, N.rate(s.mean_abs_jump)),
        el("td", {}, N.rate(s.mean_largest_jump)),
        el("td", {}, N.rate(s.max_knot_shift)),
        el("td", {style:"white-space:normal;text-align:left"}, `${s.protection_negative_in_crisis.length}: ${s.protection_negative_in_crisis.join(", ") || "none"}`),
        el("td", {style:"white-space:normal;text-align:left"}, `${s.protection_failing_acceptance.length}: ${s.protection_failing_acceptance.join(", ") || "none"}`),
        el("td", {style:"white-space:normal;text-align:left"}, labels),
      ]));
    });
    t.append(b); summaryCard.append(el("div", {class:"scroll"}, [t]));
    summaryCard.append(el("p", {class:"note"}, data.note));
  }

  function drawOne() {
    if (!data) return;
    state.instrument = sel.value; save();
    const row = data.instruments.find(i => i.instrument_id === sel.value);
    const shown = METHODS.filter(m => state.method === "all" || state.method === m.id);
    const role = data.roles[row.role];
    const series = [{label:`role: ${row.role}`, color:"var(--axis)", values: role}].concat(
      shown.map(m => ({label: m.label, color: m.color,
        values: row.views[m.id].profile, methods: row.views[m.id].methods})));
    const ccyText = CCY_LABEL(data.currency) + (data.currency ? "" :
      ` (${[...new Set(shown.map(m => row.views[m.id].series_currency))].join("/")})`);
    chartCard.replaceChildren(el("h2", {}, `${row.name} against its role (${row.role}) · ${ccyText}`));
    chartCard.append(el("p", {class:"q"},
      "Annualised log return per state, 1 crisis to 25 boom. The role curve is the long annual record in USD, nominal, and is not converted."));
    const legend = el("div", {class:"legend"});
    series.forEach(s => legend.append(el("span", {html:`<span class="swatch" style="background:${s.color}"></span>${s.label}`})));
    chartCard.append(legend);
    chartCard.append(el("div", {class:"scroll"}, [lineChart(series, {knots:[2,7,12,17,22]})]));
    const t = el("table");
    t.append(el("thead", {}, [el("tr", {}, ["estimator", "coverage", "series read", "crisis (3)", "boom (23)", `R-003 check${row.protection_type ? " · " + row.protection_type : ""}`].map(h => el("th", {}, h)))]));
    const b = el("tbody");
    METHODS.forEach(m => {
      const v = row.views[m.id], p = v.profile;
      const ok = v.protection_check ? v.protection_check.passed : false;
      b.append(el("tr", {}, [el("td", {}, m.label), el("td", {}, v.coverage),
        el("td", {}, `${v.series || "none"} · ${v.series_currency}`),
        el("td", {}, N.rate(p[2])), el("td", {}, N.rate(p[22])),
        el("td", {html: row.role === "protection" ? `<span class="${ok?"pass":"fail"}">${ok?"✓ pass":"✕ fail"}</span>` : "n/a"})]));
    });
    t.append(b); chartCard.append(el("div", {class:"scroll"}, [t]));

    const f = row.views.forward_12m;
    detailCard.replaceChildren(el("h2", {}, `12 month forward measurement · ${row.name} · ${CCY_LABEL(data.currency || f.series_currency)}`));
    detailCard.append(el("p", {class:"q"},
      "Each month is tagged with its state; the log return over the following 12 months is credited to it. Windows overlap, so n_eff counts the distinct months they cover divided by 12; a phase below six is filled from D2's scaled role shape and labelled so."));
    const tp = el("table");
    tp.append(el("thead", {}, [el("tr", {}, ["phase", "windows", "n_eff", "value", "method"].map(h => el("th", {}, h)))]));
    const bp = el("tbody");
    f.phases.forEach(p => bp.append(el("tr", {}, [el("td", {}, p.phase), el("td", {}, N.count(p.windows)),
      el("td", {}, N.count(p.n_eff)), el("td", {}, N.rate(p.value)), el("td", {}, p.method)])));
    tp.append(bp); detailCard.append(el("div", {class:"scroll"}, [tp]));
    detailCard.append(el("h2", {style:"font-size:14px;margin-top:18px"}, `After each crisis and contraction month · ${f.after_stress.length} windows`));
    const ta = el("table");
    ta.append(el("thead", {}, [el("tr", {}, ["month", "phase", "state", "next 12 months"].map(h => el("th", {}, h)))]));
    const ba = el("tbody");
    f.after_stress.forEach(w => ba.append(el("tr", {}, [el("td", {}, w.start), el("td", {}, w.phase),
      el("td", {}, String(w.state)), el("td", {class: w.forward_12m < 0 ? "fail" : ""}, N.rate(w.forward_12m))])));
    ta.append(ba);
    const det = el("details", {open: ""});
    det.append(el("summary", {}, "Table"), el("div", {class:"scroll"}, [ta]));
    detailCard.append(det);
    if (f.after_stress.length) {
      const crisis = f.after_stress.filter(w => w.phase === "crisis").map(w => w.forward_12m);
      const contr = f.after_stress.filter(w => w.phase === "contraction").map(w => w.forward_12m);
      const avg = xs => xs.length ? N.rate(xs.reduce((a,b) => a+b, 0) / xs.length) : N.opts.na;
      detailCard.append(el("p", {class:"note"},
        `Average of the windows: after crisis months ${avg(crisis)} (${crisis.length}), after contraction months ${avg(contr)} (${contr.length}).`));
    }
    detailCard.append(el("p", {class:"note"},
      "D2 caveats (HANDOVER §4.1): its level inherits the selection bias of the recovered returns and spreads it over all 25 states; its amplitude uses the median volatility of a heterogeneous role, so a role split would move every amplitude; it never inverts the role shape, so an instrument that moves against its role is wrong under D2 by construction. D2 also inherits the role shape, so any change to Income (R-001) re-shapes every Income instrument."));
  }

  ccy.addEventListener("change", () => { state.currency = ccy.value; save(); load(); });
  sel.addEventListener("change", drawOne);
  await load();
});

/* ============================ REVIEW R-001 — INCOME CANDIDATES ============================ */

/* --------------------------------------------------------------------- shell */

const panels = $("#panels"), tabsEl = $("#tabs");
let active = location.hash.slice(1) || TABS[0].id;

function select(id) {
  active = id; location.hash = id;
  [...tabsEl.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
  panels.replaceChildren(el("p", {class:"sub"}, "loading…"));
  const t = TABS.find(t => t.id === id) || TABS[0];
  const host = el("div");
  panels.replaceChildren(host);
  t.render(host).catch(e => host.replaceChildren(problemCard(e)));
}

// Say what is actually wrong, and what to type to fix it. "Failed to fetch" on its own
// sends you looking in the wrong place.
function problemCard(e) {
  const card = el("div", {class:"card"});
  if (e instanceof Unreachable) {
    card.append(el("p", {class:"err"}, `Cannot reach the engine at ${API || location.origin}`));
    card.append(el("p", {class:"q"},
      "The page loaded, but nothing answered. The engine has to be running — this file is "
      + "a client, not a server."));
    // The specific wrong turn this message exists to prevent: Docker is up, so the
    // database is up, so it looks like everything should work. The engine is not in
    // Docker and does not come back with it after a reboot.
    card.append(el("p", {class:"q"},
      "Docker running is not enough. The container is the database; the engine is a "
      + "separate process, and unlike the container it does not restart by itself."));
    card.append(el("pre", {class:"cmd"},
      "cd Projects\\Engines\\Instruments\n"
      + "start.cmd                          # or, the same thing:\n"
      + "python -m uvicorn api.main:app --port 8006"));
    if (STANDALONE) {
      card.append(el("p", {class:"note"},
        "You opened this file directly, so it is calling " + API + " across origins. "
        + "That works, but serving the page from the engine itself is simpler — open "
        + "http://127.0.0.1:8006/ instead and everything is same-origin."));
    }
    card.append(el("p", {class:"note"},
      "If the engine is on another host or port, set it in the API field above."));
  } else {
    card.append(el("p", {class:"err"}, "The engine answered with an error"));
    card.append(el("p", {class:"q"}, e.message));
    card.append(el("p", {class:"note"},
      "A 503 usually means the store has not been built yet: python -m store.etl.bootstrap"));
  }
  return card;
}
TABS.forEach(t => {
  const b = el("button", {}, t.label); b.dataset.id = t.id;
  b.addEventListener("click", () => select(t.id));
  tabsEl.append(b);
});

$("#theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  select(active);
});

// The API field is only shown when the page is opened off disk, where the base actually
// has to be resolved. Served from the engine, there is nothing to configure.
const apiInput = $("#api");
if (STANDALONE) {
  $("#apiwrap").classList.remove("hidden");
  apiInput.value = API;
  const apply = () => {
    const next = apiInput.value.trim().replace(/\/+$/, "") || DEFAULT_API;
    if (next === API) return;
    API = next;
    try { localStorage.setItem("fundmap.api", API); } catch { /* not essential */ }
    start();
  };
  apiInput.addEventListener("change", apply);
  apiInput.addEventListener("keydown", ev => { if (ev.key === "Enter") apply(); });
}

function start() {
  get("/v1/health").then(h => {
    const store = h.store ? `${h.store.dbname}.${h.store.schema} @ ${h.store.host}` : "?";
    $("#subtitle").textContent =
      `${h.engine_version} · ${h.calibration_id ?? "uncalibrated"} · ` +
      `${N.count(h.counts.instrument)} instruments · ${store} · not part of the system`;
  }).catch(e => {
    $("#subtitle").textContent = e instanceof Unreachable
      ? `no engine at ${API || location.origin}`
      : "the engine answered with an error";
  });
  select(active);
}

start();
</script>
