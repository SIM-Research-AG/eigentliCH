[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eigentlich"
version = "1.0.0"
description = "eigentliCH consumer store: client records, versioned questionnaire content, answers, plan, threads, requests and approvals, in PostgreSQL schema `eigentlich`."
requires-python = ">=3.11"
# psycopg for the store (no ORM, no alembic: owner decision, Build Instruction 9.1); PyYAML for
# config.yaml and the knowledge notes' front matter. Nothing else at runtime.
dependencies = [
    "PyYAML>=6.0,<7",
    "psycopg[binary]==3.2.3",
    # the consumer app (api.py, service.py, clients.py)
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eigentlich = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
