[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "report"
version = "1.3.0"
description = "eigentliCH Report Engine, Engine 15: reports in which every figure traces to an artefact id; connecting prose by MiniMind (on spark7), every number checked. Model-derived research output; not investment advice."
requires-python = ">=3.11"
# Runtime. Every entry is on the Engine Building Guide allowlist (section 3) except
# psycopg, admitted by decision REP-02. GET /meta reports this check live.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "PyYAML>=6.0,<7",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
# Building and testing only; never in the deploy folder.
dev = [
    "pytest==8.3.4",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
report = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live test talks to spark7 and is opt-in: python -m pytest -m live
addopts = "-q -m \"not live\""
markers = ["live: talks to the real spark7 (opt-in, run with -m live)"]
