<!doctype html>
<!--
  eigentliCH ChatBot (chatbot) test bench. Development only: not part of the system and not in the deploy folder.

  A client of the engine's HTTP surface, nothing more. Served by the engine at "/", or opened off disk, when it
  calls http://127.0.0.1:8016 (or ?api=...). No build step, no external script.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniMind test bench</title>
<style>
  :root { color-scheme: light; --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
          --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --s1: #2a78d6; --critical: #d03b3b; --good: #0ca30c; }
  @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) { color-scheme: dark; --page: #0d0d0d;
          --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
          --s1: #3987e5; } }
  :root[data-theme="dark"] { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
          --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --s1: #3987e5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px 24px 8px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  h1 { font-size: 18px; margin: 0; } #sub { color: var(--ink-2); font-size: 12px; } #themeBtn { margin-left: auto; }
  main { padding: 8px 24px 48px; max-width: 1280px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 16px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 8px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); margin-bottom: 10px; }
  input, select, textarea, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 6px 10px; }
  textarea { font: 12px ui-monospace, Consolas, monospace; min-height: 120px; width: 100%; }
  button { cursor: pointer; } button.primary { background: var(--s1); color: #fff; border-color: var(--s1); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .answer { font-size: 15px; white-space: pre-wrap; margin: 8px 0; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--axis); margin-right: 6px; }
  .bad { color: var(--critical); border-color: var(--critical); } .ok { color: var(--good); border-color: var(--good); }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { padding: 4px 8px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
  th { color: var(--ink-2); font-weight: 600; }
  pre { font: 12px ui-monospace, Consolas, monospace; background: var(--page); padding: 8px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; max-height: 320px; }
  .note { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>MiniMind · eigentliCH ChatBot</h1><span id="sub">loading</span>
  <button id="themeBtn" type="button">Theme</button>
</header>
<main>
  <section class="card">
    <h2>Question</h2>
    <label>Question <input id="q" value="Wie viel darf ich 2026 in die Säule 3a einzahlen, wenn ich eine Pensionskasse habe?"></label>
    <div class="row">
      <label>Language <select id="lang"><option>de</option><option>en</option></select></label>
      <label>Calibration <input id="cal" placeholder="active"></label>
      <button class="primary" id="ask" type="button">Ask (POST /answer)</button>
    </div>
    <label>Grounding notes (JSON list of {id, title, text, source_label})<textarea id="grounding"></textarea></label>
    <label>Client facts (JSON list of {key, label, value, source}; used only for a question about the client)<textarea id="facts">[]</textarea></label>
    <label>History (JSON list of {role, content})<textarea id="history" style="min-height:60px">[]</textarea></label>
  </section>
  <section class="card">
    <h2>MiniMind's answer</h2>
    <div id="status" class="note">No question asked yet.</div>
    <div id="answer" class="answer"></div>
    <div id="tags"></div>
    <h2 style="margin-top:14px">Numbers checked</h2>
    <table><thead><tr><th>Number</th><th>Matched sources</th></tr></thead><tbody id="numbers"></tbody></table>
    <h2 style="margin-top:14px">Warnings</h2><ul id="warnings" class="note"></ul>
    <details><summary class="note">Full ChatAnswer</summary><pre id="raw"></pre></details>
  </section>
  <section class="card">
    <h2>Recent runs</h2>
    <table><thead><tr><th>Run</th><th>Status</th><th>Question</th><th>Refused</th><th>Unverified</th></tr></thead><tbody id="runs"></tbody></table>
  </section>
  <section class="card">
    <h2>Engine</h2><pre id="meta"></pre>
    <button type="button" id="probe">Probe MiniMind (GET /model)</button><pre id="model"></pre>
  </section>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const API = params.get("api") || (location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8016");
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
// ---- display rounding: begin (review/ROUNDING.md; cockpit C-37) ----
// Canonical copy: Engines/cockpit/dev/display_rounding.js. The cockpit page and every engine's test bench carry this
// block verbatim between the begin and end lines; tests/test_api.py checks that every copy is identical. Change it
// here, then copy it into each page. Display only: the figures stay exact everywhere else (contracts, artefacts,
// stores, raw JSON views); a number is rounded only where it becomes text or a chart label.
// Use: const N = displayRounding({ lang: "en", group: "’", na: "–" }); then N.money(38250) is "CHF 38’300".
function displayRounding(opts) {
  const o = Object.assign({ lang: "en", group: "’", na: "–", minus: "−" }, opts || {});
  const WORDS = { en: { m: "m", below: "below", above: "above" }, de: { m: "Mio.", below: "unter", above: "über" } };
  const w = () => WORDS[o.lang] || WORDS.en;
  const ok = v => v !== null && v !== undefined && v !== "" && typeof v !== "boolean" && Number.isFinite(Number(v));
  const grouped = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, o.group);
  // d decimals, the integer part grouped, a true minus sign, never "-0"; sign: "+" before a positive figure
  function fixed(v, d, sign) {
    const x = Number(v), t = Math.abs(x).toFixed(d || 0), parts = t.split(".");
    const body = grouped(parts[0]) + (parts[1] ? "." + parts[1] : "");
    return (Number(t) === 0 ? "" : x < 0 ? o.minus : sign ? "+" : "") + body;
  }
  const stepped = (x, step) => Math.sign(x) * Math.round(Math.abs(x) / step) * step;
  // CHF, EUR, USD: below 1 000 whole units; to 99 999 the nearest 100; to 999 999 the nearest 1 000; then millions, two decimals
  function amountText(v) {
    const x = Number(v), a = Math.abs(x);
    if (a < 999.5) return fixed(x, 0);
    if (a < 99950) return fixed(stepped(x, 100), 0);
    if (a < 999500) return fixed(stepped(x, 1000), 0);
    return fixed(x / 1e6, 2) + " " + w().m;
  }
  const pre = (cur, text) => cur ? cur + " " + text : text;
  const N = {
    opts: o,
    ok,
    fixed: (v, d, sign) => ok(v) ? fixed(v, d, sign) : o.na,
    // an amount by the stepped rule, with its currency in front ("" for none)
    money: (v, cur = "CHF") => ok(v) ? pre(cur, amountText(v)) : o.na,
    amount: v => ok(v) ? amountText(v) : o.na,
    // a figure the client stated (a fee, a deposit, a price): shown as stated, whole units unless it has cents
    stated: (v, cur = "CHF") => ok(v) ? pre(cur, fixed(v, Number.isInteger(Number(v)) ? 0 : 2)) : o.na,
    // returns, rates, inflation: one decimal, percent; rate takes a fraction (0.049), ratePct a percent (4.9)
    rate: (v, sign) => ok(v) ? fixed(Number(v) * 100, 1, sign) + " %" : o.na,
    ratePct: (v, sign) => ok(v) ? fixed(v, 1, sign) + " %" : o.na,
    // percentage points (a shift between two rates given in percent)
    pp: (v, sign = true) => ok(v) ? fixed(v, 1, sign) + " pp" : o.na,
    // chances: whole percent; below 1 % and above 99 % in words; 0 % and 100 % only when every path agrees (exactly 0 or 1)
    chance: v => {
      if (!ok(v)) return o.na;
      const p = Number(v);
      if (p <= 0) return "0 %";
      if (p >= 1) return "100 %";
      if (p < 0.01) return w().below + " 1 %";
      if (p > 0.99) return w().above + " 99 %";
      return Math.round(p * 100) + " %";
    },
    // portfolio weights and shares: whole percent; below 1 % one decimal; 0 is "–"; weight takes a fraction, weightPct a percent
    weightPct: v => {
      if (!ok(v)) return o.na;
      const p = Number(v), a = Math.abs(p);
      if (a === 0) return "–";
      if (a < 0.05) return w().below + " 0.1 %";
      return fixed(p, a < 0.95 ? 1 : 0) + " %";
    },
    weight: v => ok(v) ? N.weightPct(Number(v) * 100) : o.na,
    // model levels without a unit (scores, expertise, network, health): the word first when there is one, two decimals
    level: (v, word) => ok(v) ? (word ? word + " (" + fixed(v, 2) + ")" : fixed(v, 2)) : o.na,
    // ratios and durations one decimal; betas two
    ratio: v => ok(v) ? fixed(v, 1) : o.na,
    beta: v => ok(v) ? fixed(v, 2) : o.na,
    // a change with its sign, d decimals (a score change 2, a z-score 1)
    signed: (v, d = 2) => ok(v) ? fixed(v, d, true) : o.na,
    // years, ages, hours, seconds: whole, never grouped (2034); counts: whole, grouped (12’000)
    whole: v => ok(v) ? fixed(Math.round(Number(v)), 0).split(o.group).join("") : o.na,
    count: v => ok(v) ? fixed(Math.round(Number(v)), 0) : o.na,
    // a figure of no stated kind (raw index values, a model card's series): three significant digits, whole from 100
    auto: v => {
      if (!ok(v)) return o.na;
      const x = Number(v), a = Math.abs(x);
      if (a === 0) return "0";
      if (a >= 999500) return fixed(x / 1e6, 2) + " " + w().m;
      if (a >= 99.5) return fixed(x, 0);
      const d = Math.min(8, Math.max(0, 2 - Math.floor(Math.log10(a))));
      return fixed(x, d).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
    },
    // chart axis: about n round ticks covering lo to hi, one step past each end (the chart hides the ticks outside its
    // range), each labelled by fn (N.money, N.rate, ...): spread the result into the chart's axis
    ticks: (lo, hi, fn, n = 5) => {
      lo = Number(lo) || 0; hi = Number(hi) || 0;
      if (hi < lo) { const t = lo; lo = hi; hi = t; }
      const raw = ((hi - lo) || Math.abs(hi) || 1) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= raw * 0.999);
      const vals = [];
      for (let k = Math.floor(lo / step + 1e-9); k * step < hi + step * (1 - 1e-9); k++) vals.push(Math.round(k * step * 1e9) / 1e9);
      return { tickmode: "array", tickvals: vals, ticktext: vals.map(v => fn(v)) };
    },
  };
  return N;
}
// ---- display rounding: end ----
  const N = displayRounding({ na: "" });
  $("grounding").value = JSON.stringify([
    {id: "N1", title: "Säule 3a: Maximalbetrag 2026", source_label: "eigentliCH Wissen: Säule 3a (2026)",
     text: "Erwerbstätige mit Pensionskasse dürfen 2026 höchstens CHF 7'258 pro Jahr in die Säule 3a einzahlen. Ohne Pensionskasse sind es 20 % des Erwerbseinkommens, höchstens CHF 36'288."},
    {id: "N2", title: "AHV: Referenzalter", source_label: "eigentliCH Wissen: AHV (2026)",
     text: "Das Referenzalter der AHV beträgt 65 Jahre, für Frauen wie für Männer (AHV 21)."}], null, 1);
  $("themeBtn").onclick = () => { const r = document.documentElement;
    r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; };

  async function call(path, opts) {
    const r = await fetch(API + path, opts);
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(`${r.status}: ${JSON.stringify(body.detail ?? body)}`);
    return body;
  }

  async function refresh() {
    try {
      const meta = await call("/meta");
      $("sub").textContent = `${meta.engine_version} · ${meta.model.display_name || "MiniMind"} (${meta.model.model}, served by ${meta.model.service} at ${meta.model.host}) · calibration ${meta.calibration_version}`;
      $("meta").textContent = JSON.stringify({contracts: meta.contract_versions, prompt: meta.prompt_version,
        model: meta.model, store: meta.store}, null, 1);
      const runs = await call("/runs?limit=15");
      $("runs").innerHTML = runs.map((r) => `<tr><td><code>${esc(r.run_id)}</code></td><td>${esc(r.status)}</td>
        <td>${esc(r.question)}</td><td>${r.refused ? "yes" : ""}</td><td>${esc(N.count(r.unverified_count))}</td></tr>`).join("");
    } catch (e) { $("sub").textContent = `engine not reachable: ${e.message}`; }
  }

  $("ask").onclick = async () => {
    $("status").textContent = "Asking...";
    let body;
    try {
      body = {question: $("q").value, language: $("lang").value, grounding: JSON.parse($("grounding").value),
              client_facts: JSON.parse($("facts").value), history: JSON.parse($("history").value)};
      if ($("cal").value.trim()) body.calibration_version = $("cal").value.trim();
    } catch (e) { $("status").textContent = `JSON: ${e.message}`; return; }
    const t0 = performance.now();
    try {
      const a = await call("/answer", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      $("status").textContent = `${a.artefact_id} · ${N.whole(performance.now() - t0)} ms round trip · model ${N.whole(a.latency_ms)} ms`;
      $("answer").textContent = a.answer;
      $("tags").innerHTML = [a.refused ? `<span class="tag bad">refused: ${esc(a.refusal_code)}</span>` : `<span class="tag ok">answered</span>`,
        `<span class="tag">${esc(a.route)}</span>`, a.basis ? `<span class="tag${a.basis === "grounded" ? " ok" : ""}">basis: ${esc(a.basis)}</span>` : "", ...a.cited_ids.map((c) => `<span class="tag">cites ${esc(c)}</span>`),
        a.unverified_numbers.length ? `<span class="tag bad">${N.count(a.unverified_numbers.length)} unverified</span>` : ""].join("");
      $("numbers").innerHTML = a.numbers.map((n) => `<tr><td>${esc(n.text)}</td><td class="${n.matched.length ? "" : "bad"}">${
        n.matched.length ? esc(n.matched.join(", ")) : "no source"}</td></tr>`).join("") || `<tr><td colspan="2" class="note">none</td></tr>`;
      $("warnings").innerHTML = a.warnings.map((w) => `<li>${esc(w)}</li>`).join("") || "<li>none</li>";
      $("raw").textContent = JSON.stringify(a, null, 1);
    } catch (e) { $("status").textContent = e.message; }
    refresh();
  };
  $("probe").onclick = async () => { try { $("model").textContent = JSON.stringify(await call("/model"), null, 1); }
                                     catch (e) { $("model").textContent = e.message; } };
  refresh();
</script>
</body>
</html>
