# Life Balance Sheet (lbs): configuration.
#
# Committed, so it never holds a password. Keep the local container's password in
# config.local.yaml (git-ignored) or set LBS_DB_PASSWORD. Precedence, lowest to highest:
#
#   this file  <  config.local.yaml  <  LBS_DATABASE_URL / DATABASE_URL  <  LBS_*
#
# Model parameters (the prototype's content records with their approval metadata, and the
# mandate policy figures) are NOT here: they are versioned calibrations, seeded from
# src/lbs/calibration.py and src/lbs/seed_records/, and extended through PUT /calibration.

service:
  host: 127.0.0.1
  port: 8013                    # Engine Building Guide section 4. Override with LBS_PORT.
  # "*" lets a test bench work when opened straight off disk. Narrow it before
  # deployment, e.g. LBS_CORS_ORIGINS=https://cockpit.example
  cors_origins: ["*"]

database:
  host: 127.0.0.1
  port: 5432
  # One database for the whole system, one schema per engine, one role per engine
  # (Engine Building Guide section 8). The role owns this schema and reads nothing else.
  dbname: simtech
  schema: lbs
  user: lbs
  sslmode: prefer               # "require" or "verify-full" for anything over a network
  connect_timeout: 10
  maintenance_dbname: postgres  # only used by `python -m lbs init-db` to CREATE DATABASE

calibration:
  # The calibration a run uses when the request does not name one. Changing it is a
  # deliberate act; proposing a new calibration through PUT /calibration never is.
  active: "1.3.0"
