[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lbsim"
version = "1.1.0"
description = "LifeBalance Simulator (Engine 14): the deterministic findings, the Monte Carlo paths and the background plan calculation on a Life Balance Sheet. Model-derived research output; not investment advice."
requires-python = ">=3.11"
# Runtime. Every entry is on the Engine Building Guide allowlist (section 3) except psycopg, admitted as in
# lbs (LBS-02), and casadi, admitted by decision LBSIM-02 and imported only inside `lbsim.optim` (LBSIM-03).
# GET /meta reports this check live.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "numpy>=2.0,<3",
    "PyYAML>=6.0,<7",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.3",
    "casadi==3.7.2",
]

[project.optional-dependencies]
# Building and testing only; never in the deploy folder.
dev = [
    "pytest==8.3.4",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lbsim = ["seed_records/*.json", "schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q -m "not slow" -p no:cacheprovider'
markers = [
    "slow: solves the optimiser (agent C); deselected by default",
]
