; supervisord for the simtech container: every engine, the lbsim workers, the app, the cockpit,
; the start-up provisioning and the Cloudflare tunnel, as programs of one supervisor.
;
; - Every program runs as the user `engine` through /opt/deploy/run.sh, which sets its database
;   login, removes every secret it does not need, waits for what it consumes (start order) and
;   prefixes each line of its output with "[name] " for `docker compose logs simtech`.
; - Every program restarts when it exits (autorestart). One that fails straight away is
;   retried with a growing pause (startretries); `supervisorctl status` shows it.
; - Engines listen on 127.0.0.1 (SIMTECH_ENGINE_BIND, which compose.debug-engines.yaml sets to
;   0.0.0.0); the app and the cockpit on 0.0.0.0, so that compose.debug.yaml can publish them.
;   Engines reach each other at http://127.0.0.1:<port>, the default in every config.yaml.
; - priority sets the start order (and the reverse stop order); run.sh's RUN_WAIT makes each
;   program wait until the engines it consumes accept connections.
;
;   docker compose exec simtech supervisorctl status
;   docker compose exec simtech supervisorctl restart honi

[supervisord]
nodaemon=true
user=root
; In the foreground supervisord writes its own messages to stdout already; no second copy.
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/run/supervisord.pid

; The control socket is root-only (0700), so this user name and password are not a secret;
; they only stop supervisord warning about a socket without authentication.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700
username=simtech
password=simtech

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock
username=simtech
password=simtech

; ---- one-shot: the provisioning, before every engine ------------------------------------------

[program:provision]
command=/opt/deploy/run.sh /opt/deploy/provision.sh
directory=/srv/Engines/Instruments
environment=RUN_DB="INSTRUMENTS:-",RUN_KEEP="all",RUN_AFTER_PROVISION="0"
user=engine
priority=10
startsecs=0
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

