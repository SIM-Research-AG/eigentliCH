stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The optimiser workers (CasADi/IPOPT with MUMPS, one core each), LBSIM_WORKERS of them. They
; take plan runs from the queue in schema lbsim (SELECT ... FOR UPDATE SKIP LOCKED); no port.
; They all start at once: each applies lbsim's schema.sql at start-up under an advisory lock, so
; the API and the workers queue for it instead of deadlocking.
[program:lbsim-worker]
process_name=%(program_name)s-%(process_num)d
numprocs=%(ENV_LBSIM_WORKERS)s
numprocs_start=1
command=/opt/deploy/run.sh python -X utf8 -m lbsim worker
directory=/srv/Engines/eigentliCH_Engines/engines/lbsim
environment=RUN_DB="LBSIM:lbsim",RUN_WAIT="8014",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1",MKL_NUM_THREADS="1"
user=engine
priority=170
startsecs=10
startretries=1000
autorestart=true
stopwaitsecs=30
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

