; The lbsim API alone; the plan workers are the next program.
[program:lbsim]
command=/opt/deploy/run.sh python -X utf8 -m lbsim serve --workers 0
directory=/srv/Engines/eigentliCH_Engines/engines/lbsim
environment=RUN_DB="LBSIM:lbsim",RUN_WAIT="8013 8007 8004 8006",LBSIM_HOST="%(ENV_SIMTECH_ENGINE_BIND)s"
user=engine
priority=160
startsecs=10
startretries=1000
