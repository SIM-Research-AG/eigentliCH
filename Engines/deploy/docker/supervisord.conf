; The cockpit (Engine 11), from its own config.yaml plus environment. Status only: supervisord
; starts the engines, so COCKPIT_LAUNCHER=off (no Start, the start route answers 409). The
; curator's database is the db container. COCKPIT_MODE and any COCKPIT_ENGINE_<KEY>_PUBLIC_URL
; come from the container's environment (.env).
[program:cockpit]
command=/opt/deploy/run.sh python -X utf8 -m cockpit serve
directory=/srv/Engines/cockpit
environment=RUN_MAP="COCKPIT_CURATOR_DB_PASSWORD=SIMTECH_CURATOR_PASSWORD COCKPIT_CURATOR_DB_HOST=SIMTECH_DB_HOST COCKPIT_CURATOR_DB_PORT=SIMTECH_DB_PORT",RUN_WAIT="8017",COCKPIT_LAUNCHER="off",COCKPIT_HOST="0.0.0.0",COCKPIT_PORT="8000",COCKPIT_DATA_DIR="/data"
user=engine
priority=200
startsecs=10
startretries=1000
autorestart=true
stopwaitsecs=20
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---- the way in -------------------------------------------------------------------------------

; Cloudflare Tunnel (outbound only), started only when CLOUDFLARE_TUNNEL_TOKEN is set
; (`simtech start` sets SIMTECH_TUNNEL). Its public hostnames, set in the Cloudflare dashboard,
; point at http://127.0.0.1:8017 (the app) and http://127.0.0.1:8000 (the cockpit). README.md.
[program:cloudflared]
command=/opt/deploy/run.sh cloudflared tunnel --no-autoupdate run
directory=/tmp
environment=RUN_MAP="TUNNEL_TOKEN=CLOUDFLARE_TUNNEL_TOKEN",RUN_AFTER_PROVISION="0",RUN_WAIT="8017 8000",HOME="/tmp"
user=engine
autostart=%(ENV_SIMTECH_TUNNEL)s
priority=210
startsecs=10
startretries=1000
autorestart=true
stopwaitsecs=20
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
