# Optional override for debugging: publishes the app (8017) and the cockpit (8000) on 127.0.0.1
# of the Docker host only (reach them from your machine with an SSH tunnel, e.g.
# ssh -L 8017:127.0.0.1:8017 -L 8000:127.0.0.1:8000 server). Never on 0.0.0.0.
#
#   docker compose -f compose.yaml -f compose.debug.yaml up -d
#
# Every engine as well (and the database): add compose.debug-engines.yaml.
# DEBUG_BIND, DEBUG_APP_PORT and DEBUG_COCKPIT_PORT move them if something else on the host
# already listens there.
services:
  simtech:
    ports:
      - "${DEBUG_BIND:-127.0.0.1}:${DEBUG_APP_PORT:-8017}:8017"
      - "${DEBUG_BIND:-127.0.0.1}:${DEBUG_COCKPIT_PORT:-8000}:8000"
