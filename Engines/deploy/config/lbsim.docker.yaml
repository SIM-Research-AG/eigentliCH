# lbsim overlay for Docker. Copied into the eigentliCH image as
# eigentliCH_Engines/engines/lbsim/config.local.yaml, which lbsim deep-merges over its config.yaml.
#
# Only what Docker changes: the upstream engines by compose service name. Everything else
# (contracts, known ids, simulation and optimiser settings) comes from lbsim's own config.yaml.
# The database host, port and password come from LBSIM_DB_* in compose.yaml, and the listening
# host from LBSIM_HOST. Once lbsim reads LBSIM_<UPSTREAM>_URL from the environment
# (ENGINE_CHANGES.md, item 1), this file can go.
upstream:
  lbs:
    url: http://lbs:8013
  pcp:
    url: http://pcp:8007
  aggregation:
    url: http://aggregation:8004
  fmre:
    url: http://fmre:8006
