# sim-tech / eigentliCH engine system on one Docker host: two containers.
#
#   cp .env.example .env        # then fill in every password (and the tunnel token)
#   docker compose build        # builds the one simtech image on this machine (no registry)
#   docker compose up -d        # db, then simtech (provisioning, every engine, app, cockpit, tunnel)
#   ./scripts/health.sh         # both containers, every supervised program, every health route
#
#   db       PostgreSQL 18 (official image) with the database simtech; also runs the nightly
#            backup (scripts/backup.sh, started by scripts/db-entrypoint.sh).
#   simtech  one image, supervisord inside (docker/supervisord.conf): the provisioning (one-shot,
#            first), the 13 engines, the lbsim plan workers, the consumer app (8017), the cockpit
#            (8000) and, when CLOUDFLARE_TUNNEL_TOKEN is set, cloudflared.
#
# Networking: inside simtech the engines reach each other on 127.0.0.1:<port>, the default in
# every engine's config.yaml; simtech reaches the database as `db:5432`. Nothing publishes a
# host port. The only way in from outside is the tunnel to the app and the cockpit, behind
# Cloudflare Access. compose.debug.yaml (and compose.debug-engines.yaml) publish ports on
# 127.0.0.1 for debugging.
#
# Build context is the Engines folder (..); docker/simtech.Dockerfile.dockerignore is the
# allowlist of what enters the image (no .venv, .env, config.local.yaml, config.toml, tests,
# golden files, dev material or caches).

name: simtech

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ---- database (and the nightly backup) ------------------------------------------------------

  db:
    image: postgres:18
    init: true                    # tini as PID 1: it reaps the backup loop, not postgres
    restart: unless-stopped
    logging: *logging
    # The official entrypoint, after starting scripts/backup.sh in the background.
    entrypoint: ["bash", "/scripts/db-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Zurich}
    volumes:
      # PG 18 keeps its data in a version subfolder (/var/lib/postgresql/18/docker), so the
      # volume is mounted one level up, as on the owner's machine.
      - pgdata:/var/lib/postgresql
      - backups:/backups
      - ./scripts:/scripts:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- everything else ------------------------------------------------------------------------

  simtech:
    build:
      context: ..
      dockerfile: deploy/docker/simtech.Dockerfile
      args:
        CLOUDFLARED_VERSION: ${CLOUDFLARED_VERSION:-2026.9.3}
    image: simtech/simtech:${IMAGE_TAG:-local}
    pull_policy: never
    init: true                    # tini as PID 1, supervisord below it
    restart: unless-stopped
    logging: *logging
    # supervisord stops the programs in reverse start order, each within 20 to 30 s.
    stop_grace_period: 90s
    # The lbsim workers are CPU-heavy (one core per solve). README.md, "Sizing".
    cpus: ${SIMTECH_CPUS:-6}
    mem_limit: ${SIMTECH_MEMORY:-10g}
    environment:
      TZ: ${TZ:-Europe/Zurich}
      # The database. Every engine gets <PREFIX>_DB_HOST/_PORT/_USER/_PASSWORD from these and
      # its own SIMTECH_<ENGINE>_PASSWORD (docker/run.sh); it sees no other engine's password.
      SIMTECH_DB_HOST: db
      SIMTECH_DB_PORT: "5432"
      # The provisioning only: the administrator, and every role's password.
      SIMTECH_ADMIN_USER: ${POSTGRES_ADMIN_USER:-myuser}
      SIMTECH_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      SIMTECH_DATAFEED_PASSWORD: ${SIMTECH_DATAFEED_PASSWORD:?set in .env}
      SIMTECH_HONI_PASSWORD: ${SIMTECH_HONI_PASSWORD:?set in .env}
      SIMTECH_MACROFIELD_PASSWORD: ${SIMTECH_MACROFIELD_PASSWORD:?set in .env}
      SIMTECH_AGGREGATION_PASSWORD: ${SIMTECH_AGGREGATION_PASSWORD:?set in .env}
      SIMTECH_MRS_PASSWORD: ${SIMTECH_MRS_PASSWORD:?set in .env}
      SIMTECH_FMRE_PASSWORD: ${SIMTECH_FMRE_PASSWORD:?set in .env}
      SIMTECH_PCP_PASSWORD: ${SIMTECH_PCP_PASSWORD:?set in .env}
      SIMTECH_CYCLE_PASSWORD: ${SIMTECH_CYCLE_PASSWORD:?set in .env}
      SIMTECH_LBS_PASSWORD: ${SIMTECH_LBS_PASSWORD:?set in .env}
      SIMTECH_LBSIM_PASSWORD: ${SIMTECH_LBSIM_PASSWORD:?set in .env}
      SIMTECH_REPORT_PASSWORD: ${SIMTECH_REPORT_PASSWORD:?set in .env}
      SIMTECH_CHATBOT_PASSWORD: ${SIMTECH_CHATBOT_PASSWORD:?set in .env}
      SIMTECH_EIGENTLICH_PASSWORD: ${SIMTECH_EIGENTLICH_PASSWORD:?set in .env}
      SIMTECH_CURATOR_PASSWORD: ${SIMTECH_CURATOR_PASSWORD:?set in .env}
      SIMTECH_CATALOGUE_PASSWORD: ${SIMTECH_CATALOGUE_PASSWORD:?set in .env}
      # report and chatbot only (the spark7 model server's Cloudflare Access service token).
      SPARK7_CLIENT_ID: ${SPARK7_CLIENT_ID:-}
      SPARK7_CLIENT_SECRET: ${SPARK7_CLIENT_SECRET:-}
      # datafeed only. Empty: its admin ingest route answers 403.
      DATAFEED_ADMIN_TOKEN: ${DATAFEED_ADMIN_TOKEN:-}
      # cloudflared only, and it starts only when this is set.
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      COCKPIT_MODE: ${COCKPIT_MODE:-development}
      # The app's address as a browser reaches it (https://app.<domain>), for the cockpit's
      # System page; empty: the page links the engines only when opened on 127.0.0.1.
      COCKPIT_ENGINE_EIGENTLICH_PUBLIC_URL: ${COCKPIT_ENGINE_EIGENTLICH_PUBLIC_URL:-}
      LBSIM_WORKERS: ${LBSIM_WORKERS:-3}
    volumes:
      - cockpit-data:/data          # the CIO's decision log (append-only JSON lines)
    healthcheck:
      # Healthy only when every engine's health route, the app's and the cockpit's answer 200.
      test: ["CMD", "simtech", "health", "--quiet"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backups:
  cockpit-data:
